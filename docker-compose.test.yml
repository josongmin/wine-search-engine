# Ephemeral CI / test lane (tmpfs PG, alternate ports). Project: wine-search-test.
# Redis excluded — same as prod/dev official stack.
name: wine-search-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wine_engine_test
      POSTGRES_USER: wine
      POSTGRES_PASSWORD: wine_test
    ports: ["5433:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wine -d wine_engine_test"]
      interval: 3s
      timeout: 3s
      retries: 10

  vespa:
    image: vespaengine/vespa:8
    ports:
      - "18080:8080"   # query/feed API (test port, avoids conflict with prod 8080)
      - "19071:19071"  # config server
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:19071/state/v1/health"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 90s
