# Field Ownership Matrix — single source of truth for every field declared in
# vespa/app/schemas/wine_entity.sd. See docs/RFC-018-scope-and-field-ownership.md
# for the contract semantics, fail_action enum, and migration plan.
#
# Row contract:
#   field:              snake_case name, must match a `field <name> type ...`
#                       declaration in wine_entity.sd
#   source:             ETL layer that writes the field
#                         silver(<file>)            — vivino-to-silver / region-normalizer
#                         track-c(<step>)           — run-track-c-step*.ts
#                         derived(<file>)           — computed in index-to-vespa.ts
#                                                     (e.g. producer_prestige,
#                                                     popularity_score boost)
#                         runtime(<surface>)        — written at query time
#                         unknown                   — no writer found anywhere
#   coverage_required:  expected non-null ratio in [0,1]
#   fail_action:        must | warn | optional
#   rationale:          domain fact / measurement / RFC reference
#   ticket (optional):  tracking key for an open backfill / cleanup task
#
# Row count MUST equal the field declaration count in wine_entity.sd.
# Validator: tools/schema-contract/validate.ts (npm script: schema-contract:validate).

fields:

  # ---------------------------------------------------------------------------
  # Core identity (§5 dual-gate `must` band: present in 100% of docs today)
  # ---------------------------------------------------------------------------

  - field: entity_id
    source: derived(index-to-vespa.ts)
    coverage_required: 1.0
    fail_action: must
    rationale: "Required identity key. Generated by silverToIndexable; without it the Vespa Document v1 API rejects the put."

  - field: entity_type
    source: derived(index-to-vespa.ts)
    coverage_required: 1.0
    fail_action: must
    rationale: "Constant string 'wine' for every doc in this schema (toVespaFields line ~420). Required for namespace partitioning."

  - field: search_snapshot_id
    source: derived(index-to-vespa.ts)
    coverage_required: 0.0
    fail_action: optional
    rationale: "Written only when caller passes --snapshot-id. Snapshot-scoped retrieval modes depend on it but ad-hoc indexing does not."

  - field: canonical_label
    source: silver(vivino-to-silver.ts)
    coverage_required: 1.0
    fail_action: must
    rationale: "Required identity field. silverToIndexable throws if canonicalLabel is empty (validateIndexableRecord)."

  - field: aliases_identity_safe
    source: silver(generate-aliases.ts)
    coverage_required: 1.0
    fail_action: must
    rationale: "Array is always written (empty array when no aliases). Identity-safe channel powers exact-match retrieval."

  - field: aliases_noisy_recall
    source: silver(generate-aliases.ts + generate-korean-aliases.ts + generate-transliteration-aliases.ts)
    coverage_required: 1.0
    fail_action: must
    rationale: "Array is always written. High-recall channel — empty is still a valid value (array is present)."

  - field: alias_prefix_terms
    source: derived(index-to-vespa.ts via buildAliasPrefixTerms)
    coverage_required: 0.0
    fail_action: optional
    rationale: "Written only when at least one alias produced a non-empty prefix term. Used for fast-search prefix queries."

  - field: producer
    source: silver(vivino-to-silver.ts)
    coverage_required: 1.0
    fail_action: must
    rationale: "fromVespaFields::getRequiredString — domain treats producer as required identity field."

  - field: region
    source: silver(vivino-to-silver.ts + region-normalizer.ts)
    coverage_required: 0.95
    fail_action: warn
    rationale: "Vivino payload exposes region/winery_region for almost all wines, but a small tail has only country. region-normalizer falls back to '' when normalisation fails."

  - field: grapes
    source: silver(vivino-to-silver.ts via extractGrapes → payload.varietal parsing)
    coverage_required: 0.38
    fail_action: warn
    rationale: "Field is always written (empty array allowed; toVespaFields inlines unconditionally), but actual NON-EMPTY coverage = 38% (4313/11367 in prod 2026-05-24). Vivino payload.grapes JSONB array is NEVER populated (0/10469 in Bronze); the only signal is payload.varietal (61% Bronze coverage) which silver parses. The 23pp Bronze→Vespa gap = silver transformRow drops (producer/wineType) + dedup variants. Wikidata grape backfill (Track C step8 candidate) is the planned lift past 80%."
    ticket: "TODO-rfc018-grapes-wikidata-backfill"

  # ---------------------------------------------------------------------------
  # Full-text search fields
  # ---------------------------------------------------------------------------

  - field: search_text_en
    source: silver(vivino-to-silver.ts)
    coverage_required: 1.0
    fail_action: must
    rationale: "Composed from canonicalLabel + producer + region + grapes + tasting notes. Always non-empty for a valid silver record."

  - field: search_text_ko
    source: derived(index-to-vespa.ts via buildSearchTextKo)
    coverage_required: 0.0
    fail_action: warn
    rationale: "Populated only when noisyRecallProjection contains Hangul aliases. Coverage tracks generate-korean-aliases.ts effectiveness — should rise as the Korean alias generator covers more wines."

  - field: synthetic_queries
    source: silver(generate-doc-queries.ts)
    coverage_required: 0.0
    fail_action: optional
    rationale: "Doc2Query expansion is opt-in per snapshot. Empty for snapshots that did not run the expansion step. BM25 weight is intentionally low (×0.6 in lexical rank profile) so absence is acceptable."

  - field: semantic_summary
    source: derived(index-to-vespa.ts via buildEmbedText)
    coverage_required: 1.0
    fail_action: must
    rationale: "Composed unconditionally from canonicalLabel + producer + region + grapePrimary + searchTextEn. Used as the embedding input text — absence means the doc cannot be embedded."

  # ---------------------------------------------------------------------------
  # Wine taste / style attributes
  # ---------------------------------------------------------------------------

  - field: body
    source: silver(vivino-to-silver.ts)
    coverage_required: 0.85
    fail_action: warn
    rationale: "Vivino taste structure exposes body for ~85-90% of red/white wines but is missing for many sparkling/dessert wines. Field is optional in IndexableWineRecord."

  - field: sweetness
    source: silver(vivino-to-silver.ts)
    coverage_required: 0.85
    fail_action: warn
    rationale: "Same Vivino taste structure as body. Coverage matches body for the same reason."

  - field: style
    source: derived(index-to-vespa.ts via deriveStyle)
    coverage_required: 0.85
    fail_action: warn
    rationale: "Derived from wineType + body + sweetness. Returns undefined when body/sweetness are absent for red/white wines (deriveStyle: 'style facets must be derivable from real data or absent')."

  - field: price_band
    source: silver(vivino-to-silver.ts)
    coverage_required: 1.0
    fail_action: must
    rationale: "silverToIndexable always writes priceBand (value/mid/premium/luxury). Required for price_band_numeric derivation."

  - field: pairing
    source: silver(vivino-to-silver.ts via extractPairings)
    coverage_required: 0.5
    fail_action: warn
    rationale: "Vivino payload food_pairings is sparse; ~half of wines have at least one pairing tag. Empty array is OK semantically."

  - field: occasion
    source: track-c(step4-occasion)
    coverage_required: 0.0
    fail_action: warn
    rationale: "Track C step4 enrichment. Coverage rises only when step4 is run; opt-in for the snapshot. Empty array is OK."
    ticket: "EPIC-12-track-c-step4-occasion-coverage"

  - field: availability
    source: derived(index-to-vespa.ts)
    coverage_required: 1.0
    fail_action: must
    rationale: "Boolean always set to true by silverToIndexable. fromVespaFields::getRequiredBoolean treats it as required."

  - field: popularity_score
    source: derived(index-to-vespa.ts via computePopularity)
    coverage_required: 1.0
    fail_action: must
    rationale: "Always written (rec.popularityScore + isTopRated boost). Required input to hybrid ranking expression."

  # ---------------------------------------------------------------------------
  # Wine-domain attribute fields
  # ---------------------------------------------------------------------------

  - field: vintage_year
    source: silver(vivino-to-silver.ts)
    coverage_required: 0.9
    fail_action: warn
    rationale: "Most Vivino records carry vintage_year. NV (Non-Vintage) sparklings and a small tail of malformed records are exceptions."

  - field: acidity
    source: silver(vivino-to-silver.ts)
    coverage_required: 0.85
    fail_action: warn
    rationale: "Same Vivino taste structure as body/sweetness."

  - field: tannin
    source: silver(vivino-to-silver.ts)
    coverage_required: 0.0
    fail_action: warn
    rationale: "Vivino exposes tannin only for red wines (~30-40% of corpus). Absent for whites/sparkling by domain definition — not data corruption."

  - field: finish_length
    source: silver(vivino-to-silver.ts)
    coverage_required: 0.0
    fail_action: warn
    rationale: "Vivino payload rarely includes finish_length; coverage is naturally low. Field is optional in the Vespa schema for that reason."

  - field: wine_type
    source: silver(vivino-to-silver.ts)
    coverage_required: 1.0
    fail_action: must
    rationale: "Required — deriveStyle throws if wineType is undefined. red/white/sparkling/dessert/fortified/rosé."

  - field: grape_primary
    source: silver(vivino-to-silver.ts via resolveDominantGrape — region table + grapes[0] fallback)
    coverage_required: 0.38
    fail_action: warn
    rationale: "Resolved by resolveDominantGrape: region/appellation lookup (Pomerol→Merlot, Pauillac→CabS, Barolo→Nebbiolo, ...) when grape list has >1 variety; falls back to grapes[0] otherwise. Coverage tracks the `grapes` field (38%) since empty list → null primary. The earlier `grapes[0]` blind selection produced wrong primaries for blends (e.g. Pomerol→Malbec); fixed 2026-05-24 — see test/regression/silver-resolve-dominant-grape.regression.test.ts."
    ticket: "TODO-rfc018-grapes-wikidata-backfill"

  - field: country
    source: silver(vivino-to-silver.ts)
    coverage_required: 0.99
    fail_action: warn
    rationale: "Vivino regions table joins to country. Near-100% coverage; a handful of orphan regions in long tail."

  - field: appellation
    source: silver(region-normalizer.ts) + ETL backfill PENDING
    coverage_required: 0.0
    fail_action: warn
    rationale: "Vivino payload has no appellation; vivino-to-silver.ts explicitly sets appellation=null. region-normalizer reconstructs a small fraction from breadcrumb mangling. Currently 0/11367 in prod (memo project_appellation_field_empty_in_vespa). Track C step8 (gazetteer-driven backfill) is the planned path; rule 25 (single SSoT vocab) applies to the gazetteer."
    ticket: "project-appellation-field-empty-in-vespa"

  - field: producer_prestige
    source: derived(index-to-vespa.ts via computeProducerPrestige)
    coverage_required: 0.5
    fail_action: warn
    rationale: "Derived from ratingsCount + ratingAvg via documented Vivino-anchored formula (see index-to-vespa.ts:83-89 named constants). Undefined for wines with zero community ratings; ranker treats missing as 0."

  - field: critic_score_normalized
    source: derived(index-to-vespa.ts) ← track-c(step1-critic-proxy) OR vivino-rating
    coverage_required: 0.95
    fail_action: warn
    rationale: "Either Track C step1 criticProxy.proxyScore/100 or vivino ratingAvg/5. Near-100% because almost every wine has a Vivino rating."

  - field: critic_confidence_weight
    source: derived(index-to-vespa.ts via criticConfidenceWeight)
    coverage_required: 0.5
    fail_action: warn
    rationale: "Optional per-wine critic trust weight from Track C step1 criticProxy.confidenceWeight; absent when no critic proxy is available (ranker defaults to 1.0 in wine_entity.sd)."

  - field: price_usd
    source: silver(vivino-to-silver.ts)
    coverage_required: 0.85
    fail_action: warn
    rationale: "Vivino price.amount is currency-converted to USD. Absent for wines with no price listing (~15%)."

  - field: rating_avg
    source: silver(vivino-to-silver.ts)
    coverage_required: 0.99
    fail_action: warn
    rationale: "Vivino exposes rating average for any wine with at least 1 rating."

  - field: ratings_count
    source: silver(vivino-to-silver.ts)
    coverage_required: 0.99
    fail_action: warn
    rationale: "Always present alongside rating_avg; zero is a valid value (wine with no community ratings yet)."

  - field: review_count
    source: silver(vivino-to-silver.ts)
    coverage_required: 0.95
    fail_action: warn
    rationale: "Vivino exposes review_count separately from ratings_count; not all wines have written reviews."

  - field: rating_distribution_json
    source: silver(vivino-to-silver.ts)
    coverage_required: 0.0
    fail_action: warn
    rationale: "Vivino exposes per-star rating breakdowns only for wines with sufficient sample size. Sparse by design."

  - field: winery_rating_count
    source: silver(vivino-to-silver.ts)
    coverage_required: 0.99
    fail_action: warn
    rationale: "Winery-level rollup; almost always present once winery_id resolves."

  - field: bottle_size_ml
    source: silver(vivino-to-silver.ts)
    coverage_required: 0.85
    fail_action: warn
    rationale: "Numeric ml. Mostly 750 (standard bottle); halves/magnums tagged correctly when payload carries volume. See open question §8 on bottle_size vs bottle_size_ml duplication."

  - field: bottle_size
    source: silver(vivino-to-silver.ts)
    coverage_required: 0.85
    fail_action: warn
    rationale: "String label form (e.g. '750 ml', 'magnum'). Duplicates bottle_size_ml — RFC-018 §8 lists this as open question for deprecation."

  - field: closure
    source: silver(vivino-to-silver.ts)
    coverage_required: 0.0
    fail_action: warn
    rationale: "Vivino rarely exposes closure (cork/screwcap/synthetic). Coverage naturally low."

  # ---------------------------------------------------------------------------
  # SOTA++ enrichment fields (Epic 12)
  # ---------------------------------------------------------------------------

  - field: critic_proxy_score
    source: unknown
    coverage_required: 0.0
    fail_action: warn
    rationale: "Track C step1 generates GoldRecord.criticProxy.proxyScore but silverToRetrievalDoc/toVespaFields does NOT map it to this Vespa field. Either the ETL writer must be added or this .sd field must be removed."
    ticket: "TODO-rfc018-critic-proxy-writer-missing"

  - field: critic_proxy_tier
    source: unknown
    coverage_required: 0.0
    fail_action: warn
    rationale: "Track C step1 generates GoldRecord.criticProxy.scoreTier but no ETL writer exists. Mirror of critic_proxy_score."
    ticket: "TODO-rfc018-critic-proxy-writer-missing"

  - field: critic_proxy_confidence
    source: unknown
    coverage_required: 0.0
    fail_action: warn
    rationale: "Track C step1 generates GoldRecord.criticProxy.confidence but no ETL writer exists. Mirror of critic_proxy_score."
    ticket: "TODO-rfc018-critic-proxy-writer-missing"

  - field: pairing_tags
    source: unknown
    coverage_required: 0.0
    fail_action: warn
    rationale: "Track C step3 produces GoldRecord.pairingTags but silverToIndexable assigns it to `pairing` (the legacy string array field), not the BM25-indexed `pairing_tags` Vespa field. Duplicate field needs disambiguation."
    ticket: "TODO-rfc018-pairing-tags-writer-missing"

  # ---------------------------------------------------------------------------
  # SOTA++ taxonomy fields
  # ---------------------------------------------------------------------------

  - field: flavor_profiles
    source: silver(vivino-to-silver.ts via extractFlavorProfiles)
    coverage_required: 0.6
    fail_action: warn
    rationale: "Vivino flavor descriptors (e.g. 'blackcurrant', 'cedar') extracted from tasting notes. Sparse for wines without tasting notes."

  - field: classification
    source: silver(vivino-to-silver.ts via extractClassification) + ETL backfill PENDING
    coverage_required: 0.1
    fail_action: warn
    rationale: "Rule-based extraction (DOCG/Grand Cru/etc.) from style/wine_style strings. Coverage <20% because Vivino rarely encodes classification structurally. Gazetteer-driven backfill (Wave 4) will lift this."

  - field: alcohol_pct
    source: silver(vivino-to-silver.ts via parseAlcohol)
    coverage_required: 0.7
    fail_action: warn
    rationale: "Parsed from Vivino alcohol string (e.g. '14%'). Missing when label lacks ABV."

  - field: drinking_window_start
    source: track-c(step4-drinking-window-backfill) + silver
    coverage_required: 0.5
    fail_action: warn
    rationale: "Track C step4 drinking-window model fills for wines with sufficient sensory signal; older snapshots may be incomplete."

  - field: drinking_window_end
    source: track-c(step4-drinking-window-backfill) + silver
    coverage_required: 0.5
    fail_action: warn
    rationale: "Paired with drinking_window_start — written together or not at all."

  - field: drinking_window_model_version
    source: track-c(step4-drinking-window-backfill)
    coverage_required: 0.5
    fail_action: warn
    rationale: "Provenance string for the drinking-window model that wrote start/end. Required for invalidating stale predictions when the model is retrained."

  - field: oak_treatment
    source: silver(vivino-to-silver.ts via extractOakTreatment)
    coverage_required: 0.0
    fail_action: warn
    rationale: "Sparse extraction from tasting notes. Coverage naturally low."

  - field: certifications
    source: track-c(step2-certifications)
    coverage_required: 0.0
    fail_action: warn
    rationale: "String array (e.g. ['organic','biodynamic']). Flattened from CertificationResult booleans. See organic/biodynamic rows for the open question on duplication."

  - field: soil_type
    source: unknown
    coverage_required: 0.0
    fail_action: warn
    rationale: "No ETL writer exists for soilType anywhere. .sd declaration was added speculatively (likely for future regional gazetteer enrichment). Either backfill or remove from .sd."
    ticket: "TODO-rfc018-soil-type-no-writer"

  - field: producer_type
    source: unknown
    coverage_required: 0.0
    fail_action: warn
    rationale: "No ETL writer exists for producerType. Same situation as soil_type."
    ticket: "TODO-rfc018-producer-type-no-writer"

  - field: gift_suitability_score
    source: track-c(step6-gift-suitability)
    coverage_required: 0.0
    fail_action: warn
    rationale: "LLM-classified suitability score in [0,1]. Coverage rises only when step6 runs."
    ticket: "EPIC-12-track-c-step6-gift-suitability-coverage"

  - field: beginner_suitability_score
    source: track-c(step7-beginner-suitability)
    coverage_required: 0.0
    fail_action: warn
    rationale: "Same pattern as gift_suitability — opt-in Track C step."
    ticket: "EPIC-12-track-c-step7-beginner-suitability-coverage"

  # ---------------------------------------------------------------------------
  # Task 5: Schema Structuring Enhancements
  # ---------------------------------------------------------------------------

  - field: grape_family
    source: derived(index-to-vespa.ts via GRAPE_FAMILY_MAP)
    coverage_required: 0.85
    fail_action: warn
    rationale: "Derived from grape_primary using authoritative lookup table (rule 27: no whitespace split). Undefined when multi-word variety is not in GRAPE_FAMILY_MAP."

  - field: region_hierarchy
    source: silver(region-normalizer.ts)
    coverage_required: 0.9
    fail_action: warn
    rationale: "Country / Region / Sub-region breadcrumb. Reconstructed from mangled region string by region-normalizer. Coverage high but not 100% due to malformed source data."

  - field: price_band_numeric
    source: derived(index-to-vespa.ts via priceBandToNumeric)
    coverage_required: 1.0
    fail_action: must
    rationale: "Always derived from price_band (1=value, 2=mid, 3=premium, 4=luxury). priceBandToNumeric throws on unknown — never absent."

  # ---------------------------------------------------------------------------
  # Dense embedding + sparse + lineage
  # ---------------------------------------------------------------------------

  - field: embedding
    source: derived(index-to-vespa.ts via OpenAI text-embedding-3-small)
    coverage_required: 1.0
    fail_action: must
    rationale: "1024-dim float tensor. silverToRetrievalDoc requires an embedding for every document (fail-closed; no deterministic fallback in production). Without embedding the semantic / hybrid rank profiles cannot score the doc."
    excluded_from_live_probe: true
    excluded_from_live_probe_reason: "Not listed in `document-summary full` (wine_entity.sd:460) by design — embeddings are 1024-dim tensors omitted from response payloads. Coverage is enforced at ingest time and on prepared-feed mode; live Vespa probe reads via summary=full and would always observe 0%."

  - field: learned_sparse_weights
    source: silver(learned-sparse-spec.ts) — opt-in
    coverage_required: 0.0
    fail_action: optional
    rationale: "SPLADE-style sparse weights, opt-in per snapshot. learned_sparse rank profile depends on it but is not the default."

  - field: source_record_refs_json
    source: derived(index-to-vespa.ts)
    coverage_required: 1.0
    fail_action: must
    rationale: "JSON-stringified [{sourceSystem, sourceRecordId}]. Always written by silverToRetrievalDoc — required for canonical-entity lineage and cross-source dedup."
