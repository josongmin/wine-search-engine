    - test/regression/situational-query-policy-properties.regression.test.ts

depends_on: []

related_rfcs: []

known_limitations:
  - "Pairing context extraction은 verbatim residue 기반 — sentence parsing 아님 (단, 출력은 80자로 캡)"
  - "Confidence score 미제공 (binary classification)"
  - "Context modifier vocabulary는 hard-coded (online/virtual/live/session/실시간/온라인/시음회)"
  - "어휘 기반 분류 — OOD 어휘 목록에 없는 비-와인 주류(mead/perry 등)는 통과"
  - "영어 'for goodness sake' 같은 희귀 관용구는 여전히 sake로 매칭 가능 (와인 검색 맥락에서 극히 드묾)"

next_steps:
  - "LLM-backed intent classifier (situational vs lexical) with calibrated confidence — maturity 5 진입 조건"
  - "Pairing dish entity extraction via NER instead of residue heuristic"
  - "Expand OOD vocabulary coverage (mead, perry, fortified non-wine, etc.)"
  - "OOD/weather 어휘를 adaptive-budget.ts의 병렬 분류기와 공유 SSoT 모듈로 통합 검토 (rule 30)"

