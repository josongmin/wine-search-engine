id: nlu.situational-query-policy
name: Situational Query Policy (OOD + Online Tasting Filter)
category: nlu
summary: |
  특수 케이스 early-exit classifier. (1) phrase-level online tasting query
  (hard-block, context-modifier required); (2) OOD alcohol query (spirits/
  beer/cocktail — redirect with pairing-intent preservation when applicable);
  (3) unsupported external info (weather). 매칭 시 situational directive 반환,
  아니면 pass-through.

maturity: 4
maturity_rationale: |
  Substring-collision hardening (CLAUDE.md rule 29 — the #1 bug class) +
  property-based invariant suite. 구조적으로 수정한 실제 버그:
  (a) bare "진" 매칭이 "진한"(full-bodied)/"사진"(photo)/"진짜"를 OOD alcohol
  로 오분류 → 전체 loanword "진토닉"만 매칭하도록 축소; (b) bare "럼"이
  "드럼"/"클럼지"를 오분류 → Korean boundary `[^가-힣]` 요구; (c) Latin 토큰이
  무경계로 "rumored"→rum, "ginger/beginning"→gin, "training/terrain"→rain,
  "delivery"→live, "obsession"→session 오분류 → ASCII `\b` 경계 적용;
  (d) "for the sake of" 관용구가 sake(청주)로 오분류 → negative lookahead
  `sake(?!\s+of\b)`로 구조적 배제. NFC stability: 모든 entry point가 입력을
  Unicode NFC로 정규화 — NFD(macOS/IME) 한글이 더 이상 silent miss 안 함.
  Bounded output: pairing residue가 MAX_PAIRING_CONTEXT_LEN(80)로 캡.
  모든 정규식 상수는 named const + rationale 주석. Korean boundary는 절대
  `\b` 미사용 (rule 8). 16-case fast-check property suite (numRuns=100):
  determinism / NFC stability / collision safety / 한국어 occasion
  (결혼기념일·집들이·회식·돌잔치) false-positive safety / input safety /
  bounded output. 기존 18-case precision suite 유지.
  여전히 SOTA(5)가 아닌 이유: 분류기가 lexical/regex 기반이며, calibrated
  confidence를 갖는 LLM-backed situational-vs-lexical intent classifier
  (next_steps)가 미구현. 정밀도·결정성·관측 가능성 면에서 productionizable
  하게 견고하나, 의미 기반 일반화는 아직 어휘에 의존.

