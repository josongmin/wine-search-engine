id: nlu.query-expansion-builder
name: Query Expansion Builder
category: nlu
summary: |
  Ambiguous query token (typo, alias, variant)을 candidate term 집합으로 expansion.
  Transliteration view, alias catalog, fuzzy match 결합. retrieval candidate 풀 확대용.

maturity: 3
maturity_rationale: |
  Functional, anchor-extraction과 결합되어 운영. Maturity 3 단계 보강:
  - 명시적 budget cap (MAX_EXPANSION_TERMS = 8) — lexical+semantic 합산 상한.
  - Overlap pruning — case-folded canonical key로 중복 anchor 제거.
  - Deterministic source-priority ordering: exact → alias → transliterated → fuzzy.
  - 전용 regression suite (Korean transliteration, typo, mixed input, boundary,
    determinism×5, degenerate input) 13 케이스 추가.
  남은 한계는 expansion 가중치 학습(weight tuning)뿐이며, ordering과 cap은 결정적.

status: active
since: 2025-10
last_reviewed: 2026-05-21
owner: core

surfaces:
  - "Internal"

key_files:
  - src/domain/query/service/expansion-builder.ts

tests:
  regression:
    - test/regression/query-expansion-builder.regression.test.ts

depends_on:
  - korean-i18n.transliterator
  - korean-i18n.curated-alias-catalog
  - nlu.anchor-extraction

related_rfcs: []

known_limitations:
  - "Expansion 가중치 fixed (학습 없음)"

next_steps:
  - "Expansion 가중치 학습 (signal feedback loop)"
  - "Per-intent cap differentiation (현재는 전 intent 동일 cap=8)"

tags:
