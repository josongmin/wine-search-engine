id: nlu.anchor-extraction
name: Anchor Extraction (Entity Anchoring)
category: nlu
summary: |
  Query 내 wine name / region / producer / grape entity anchor 검출. fuzzy alias matching
  + canister 기반 lookup plan + confidence ranking. Korean mixed-query marker
  ("같은", "비슷한", "보다") + 영문 comparison marker ("vs", "compared to") 처리,
  phrase-level idiom/temporal anti-pattern guard 포함.

maturity: 5
maturity_rationale: |
  Alias matcher 추상화 + unit test + planner 통합 + 2-tier regression suite:
  (1) enumerated marker-precision (`anchor-extraction-marker-precision.regression.test.ts`,
  17 case) + (2) property-based invariants (`anchor-extraction-properties.regression.test.ts`,
  fast-check numRuns=100). Property suite는 hand-picked case를 넘어 생성 공간 전체에서
  invariant를 잠금: determinism(동일 query 5회 → 동일 verdict), idiom false-positive
  guard(생성된 모든 temporal "X와/과 같은 …" + "<noun>처럼" simile → 절대 marker
  미발화), true comparison detection(entity-pair × 모든 Latin marker {vs/versus/
  compared to} 및 Korean "과/와 … 비교" frame → 발화), NFC idempotence(production
  normalizer 계약 형태), empty/noise-only → no false anchor, accented-Latin +
  apostrophe entity("Château d'Yquem") preservation. NFD divergence는 pinned
  known-limitation으로 잠금(loosening 금지, normalizer가 NFC 보장). 아직 미진:
  lookup strategy ranking (exact > fuzzy > metaphone) hardcoded, multi-anchor
  priority 결정론은 confidence + surface form tiebreaker로만 보장 (rank-learned 아님).

status: active
since: 2025-09
last_reviewed: 2026-05-21
owner: core

surfaces:
  - "Internal"

key_files:
  - src/domain/query/service/anchor-extractor.ts
  - src/domain/query/service/alias-lookup-plan.ts
  - src/domain/query/service/alias-match-confidence.ts

tests:
  regression:
    - test/regression/anchor-extraction-marker-precision.regression.test.ts
    - test/regression/anchor-extraction-properties.regression.test.ts
  unit:
    - src/domain/query/__tests__/anchor-extractor.test.ts
    - src/domain/query/service/__tests__/relative-query-extractor.test.ts

depends_on:
  - nlu.query-normalizer
  - korean-i18n.curated-alias-catalog

related_rfcs:
  - docs/RFC-005.md

known_limitations:
  - "Lookup strategy ranking hardcoded (exact > fuzzy > metaphone)"
  - "Multi-anchor priority는 confidence + surface tiebreaker 기반 — learned ranker 아님"
  - "Idiom anti-pattern list는 enumerated (audit-driven, not exhaustive)"
  - "Marker regex는 NFC(precomposed Hangul) 입력 가정 — raw NFD jamo 입력은 미발화 (nlu.query-normalizer가 NFC 보장; property suite에 pinned)"

next_steps:
  - "Lookup strategy ranking 학습화 (LTR/contextual)"
  - "Idiom anti-pattern 자동 마이닝 (corpus-driven)"
  - "Multi-anchor priority 결정용 contextual reranker"

tags:
  - entity-resolution
  - fuzzy-matching
  - anchor-detection
