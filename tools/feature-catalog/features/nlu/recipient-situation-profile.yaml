id: nlu.recipient-situation-profile
name: Recipient Situation Profile (Gift Classification)
category: nlu
summary: |
  Gift / 받는 사람 상황 분류. profile: parents_first_time / senior_colleague_gift /
  unknown_preference_recipient. 두 경로 운영: (1) candidate-side 13-axis voting
  (wine_type, style, region, occasion, body/tannin/acidity, producer prestige 등)
  으로 retrieval 후 필터, (2) query-side classifier (한·영 signal 사전 + saturation
  scoring)로 NLU 시점에 profile + confidence + runner-up 산출.

maturity: 4
maturity_rationale: |
  HONEST 4. query-side classifier 계약을 fast-check property suite (numRuns=100,
  14 tests)로 락업: determinism (순수 함수, 반복 호출 deep-equal), adversarial
  unicode/control/emoji no-throw (binary-unit fuzz), call-history 독립성 (공유
  가변 상태 없음), runner-up < top + distinct + positive evidence, Korean NFC/NFD
  동치 분류, Korean 조사 agglutination robustness, Latin substring-collision
  safety (rule 29 — signal 부분문자열 포함 단어 미발화, free-standing token만 발화),
  Korean non-gift false-positive safety, whitespace → confidence 0, monotonicity
  (recipient signal 추가가 confidence 낮추지 않음). confidence ∈ [0,1] + canonical
  RECIPIENT_PROFILE_VALUES 결정론 tie-break. backward-compatible candidate API 유지.
  Math.random/toLocaleString/\b-비ASCII 함정 없음.

  남은 maturity 5 과제 (product/learning gap, code 결함 아님): axis weight를
  offline gift-quality 라벨로 학습, profile inventory 확장 (chef/collector/
  health-conscious), query-side ↔ candidate-side 신호 cross-validation harness.

status: active
since: 2025-09
last_reviewed: 2026-05-21
owner: core

surfaces:
  - "Internal (used by semantic-contract-compiler, candidate-constraint-evidence)"
  - "Query NLU classifier (classifyRecipientSituationProfile)"

key_files:
  - src/domain/query/service/recipient-situation-profile.ts

tests:
  regression:
    - test/regression/recipient-situation-profile.regression.test.ts
    - test/regression/recipient-situation-profile-properties.regression.test.ts

depends_on:
  - nlu.query-normalizer

related_rfcs:
  - docs/RFC-005.md

known_limitations:
  - "Axis weight equal — 학습 없음"
  - "Threshold (confidence floor 0.2, saturation 3) uncalibrated against gold labels"
  - "Profile inventory 3개 — chef / collector / health-conscious 등 누락"
  - "Query-side classifier와 candidate-side axis voting이 독립 신호 — 일관성 자동 검증 없음"

next_steps:
  - "Offline gift-quality 라벨로 axis weight + saturation 학습"
  - "Profile inventory 확장 (chef / collector / health-conscious)"
  - "Query-side signal 사전과 candidate-side axis 사이 cross-validation harness"

tags:
