id: nlu.pairing-extraction
name: Food Pairing Extraction
category: nlu
summary: |
  Query에서 페어링 시그널 추출. 페어링 keyword ("with", "pairs with", "함께", "어울리는")
  + food mention (protein/dish/cuisine) 감지 후 PairingConstraints 산출. zero-LLM.
  Negation/exclusion phrase-level 파싱 지원 (영어 "without/but not/except",
  한국어 "없이/빼고/말고/안 좋아하는").

maturity: 5
maturity_rationale: |
  SOTA++. Phrase-level negation/exclusion 파싱 + fast-check property-regression
  (numRuns=100) 57 tests로 invariants 락업. Determinism, bounded output, NFC
  stability (macOS HFS+ NFD → NFC 정규화 boundary fix in extractPairingConstraints
  WithExclusions), substring-collision safety (회 vs 회사 / 전 vs 전체 / 굴 vs 굴소스
  homograph audit), no `\b` on Hangul, prototype-pollution defense, empty-input
  totality. REAL BUG FIX: NFD-decomposed Hangul (paste/HFS+ origin) byte-mismatched
  NFC PAIRING_TAXONOMY terms — silently dropped pairing signals. Fixed structurally
  via `query.normalize('NFC')` boundary normalization (no heuristic). Korean
  predicative negation은 korean-negation-normalizer 경유로 canonical "말고" 정규화.
  Multi-food 쿼리는 PAIRING_TAXONOMY 순회로 모든 매칭 태그 반환. Caller signature
  무변경 — 기존 12 negation regression + 2 extractor unit + 57 새 property test로
  3중 락업.

status: active
since: 2025-09
last_reviewed: 2026-05-21
owner: core

surfaces:
