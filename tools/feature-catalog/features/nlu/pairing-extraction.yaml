id: nlu.pairing-extraction
name: Food Pairing Extraction
category: nlu
summary: |
  Query에서 페어링 시그널 추출. 페어링 keyword ("with", "pairs with", "함께", "어울리는")
  + food mention (protein/dish/cuisine) 감지 후 PairingConstraints 산출. zero-LLM.
  Negation/exclusion phrase-level 파싱 지원 (영어 "without/but not/except",
  한국어 "없이/빼고/말고/안 좋아하는").

maturity: 3
maturity_rationale: |
  Phrase-level negation/exclusion 파싱 완료: 영어 "wine without seafood",
  "steak but not lobster", 한국어 "해산물 빼고", "새우는 안 좋아하는" 모두
  positive list에서 제외하고 별도 excluded 채널로 surface
  (extractPairingConstraintsWithExclusions). Korean predicative negation은
  korean-negation-normalizer 경유로 canonical "말고" 형태로 정규화 후 처리.
  Multi-food 쿼리는 PAIRING_TAXONOMY 순회로 모든 매칭 태그 반환 (conflate 해소).
  Dedicated negation regression test 12케이스 (한/영 + 적대적/엣지) +
  기존 extractor unit 2케이스. extractAllPairingConstraints는 included만
  반환하도록 정렬 — 기존 caller (agent-tool-execution-policy, deterministic-router,
  search-tool-retrieval-core, constraint-compiler, planner, query-execution-contract)
  signature 무변경.
  남은 한계: confidence binary (graded marker 미지원), 페어링 keyword/food
  trigger ranking 없음.

status: active
since: 2025-09
last_reviewed: 2026-05-21
owner: core

surfaces:
  - "Internal (used by tools.get-food-pairings + semantic-contract)"

key_files:
  - src/domain/query/service/pairing-extractor.ts
  - src/domain/query/service/korean-negation-normalizer.ts

tests:
  regression:
    - test/regression/pairing-extraction-negation.regression.test.ts
  unit:
    - src/domain/query/service/__tests__/pairing-extractor.test.ts

depends_on:
  - nlu.query-normalizer
  - nlu.rule-based-constraint-extractor

related_rfcs:
  - docs/RFC-005.md

known_limitations:
  - "Confidence binary (strong/weak marker grading 미지원)"
  - "페어링 keyword와 food trigger 간 ranking 없음 (전부 동일 priority)"

next_steps:
  - "Graded confidence (strong/weak negation marker, hedge phrase)"
  - "Pairing keyword × food trigger co-occurrence ranking"

tags:
  - food-pairing
  - constraint-extraction
  - rule-based
  - negation-aware
