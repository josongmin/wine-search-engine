id: nlu.rule-based-constraint-extractor
name: Rule-Based Negation Constraint Extractor
category: nlu
summary: |
  한국어 부정 particle (안/못 + verb → NOT constraint) + 영어 negation (not/no/never)
  정규화 + 50+ exclusion rule로 attribute 도메인 mapping (e.g. "no high tannin" →
  tannin_max < 3). Pure lexical, composable.

maturity: 5
maturity_rationale: |
  Korean negation morphology를 industry NLP taxonomy 수준으로 정형화 + property-based
  exhaustiveness 검증. named constants: NEGATION_SOFT_CAP_QUANTILE=0.4, NEGATION_HARD_CAP_QUANTILE=0.25.
  Two regression suites: (1) 31-case scenario suite, (2) NEW property suite
  (rule-based-constraint-extractor-properties.regression.test.ts, 27 tests, 12 fast-check
  properties × numRuns=100): negation taxonomy exhaustiveness (particle × attribute matrix),
  SOFT<HARD ordering invariant, extraction idempotence, positive+negative coexistence,
  false-positive guard (prosaic negation generators), NFC stability, 22+ Korean josa variations.
  Industry pattern: Korean 부정 표현 morphological analysis. SOTA++ — property-based
  linguistic invariants over the full particle space.

status: active
since: 2025-09
last_reviewed: 2026-05-21
owner: core

surfaces:
  - "Internal (used by constraint extraction)"

key_files:
  - src/domain/query/service/rule-based-constraint-extractor.ts
  - src/domain/query/service/korean-negation-normalizer.ts

tests:
  regression:
    - test/regression/rule-based-constraint-extractor.regression.test.ts
    - test/regression/rule-based-constraint-extractor-properties.regression.test.ts

depends_on:
  - nlu.query-normalizer

related_rfcs:
  - docs/RFC-004.md

known_limitations:
  - "Rule 50+ hardcoded — learning 없음"
  - "Quantile cutoff은 catalog 분포 가정 (실제 catalog 분포와 sync 필요)"
  - "Tannin/sweetness만 quantile cap 적용 — acidity/body 미적용"

next_steps:
  - "Offline error analysis 기반 rule 확장"
  - "ML-driven scope arbitration (5단계 진입 요건)"
  - "Acidity/body 등 다른 palate 축에도 quantile cap 확장"

tags:
  - negation
  - rule-based
  - korean-native
