id: nlu.constraint-topology-planner
name: Constraint Topology Planner
category: nlu
summary: |
  Multi-constraint query를 결정적 graph로 컴파일 (constraint atom → DAG). topology-pattern-lexicon
  template과 결합해 execution topology 결정. redundant index scan 최소화 + 일관된 ranking
  hint.

maturity: 5
maturity_rationale: |
  ADR-012 Phase 1b.2 LLM-backed planner + Wave F1 deterministic detector를 한 쌍의 결정적
  계약으로 운영: 입력 (atoms, slotIds, query) 동일 시 출력도 동일 (`generatedAt` 제외).
  fast-check property 회귀 (numRuns=100, 12개 invariants) 가 다음을 잠금:
  P1 gate 순수성, P2 한국어 XOR 키워드 always-open, P3 multi-subquery hint always-open,
  P4 temperature=0/seed=1 결정성, P5 closed-gate side-effect-freeness (LLM 미호출),
  P6 slotIds/atoms 길이 불일치 → null, P7 slotId conservation (silent drop 0),
  P8 한국어 값 NFC verbatim 보존, P9 plan determinism modulo generatedAt,
  P10 non-JSON → null, P11 Zod 거부 → null, P12 bounded fan-out (≤1024 nodes).
  기존 unit 회귀 (13 tests) + property 회귀 (15 tests) = 28 tests 가 ADR-012 / RFC-004
  계약을 잠금. heuristic 없음 — 모든 분기는 Unicode-safe lexicon + Zod schema gate
  로 결정. Pattern parameterization 은 topology-pattern-lexicon SSoT 에 위임,
  overlap precedence 는 `mergeTopologyIntoTrivial` disjoint-namespace 계약으로 정의됨.

status: active
since: 2025-10
last_reviewed: 2026-05-21
owner: core

surfaces:
  - "Internal"

key_files:
  - src/domain/query/service/constraint-topology-planner.ts
  - src/domain/query/service/prompts/constraint-graph-topology.prompt.ts
  - src/domain/query/service/deterministic-topology-detector.ts
  - src/domain/query/service/merge-topology-into-trivial.ts

tests:
