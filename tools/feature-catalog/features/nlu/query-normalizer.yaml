id: nlu.query-normalizer
name: Query Normalizer (Multi-View)
category: nlu
summary: |
  5 normalized view 생성: (1) NFKC + lowercase + punctuation strip, (2) Korean josa 제거,
  (3) phonetic normalize (sch→ch, ph→f, eaux→o), (4) Korean transliteration view
  (샤또 마고 → chateau margaux), (5) compact form. Vintage canonicalization 포함.

maturity: 4
maturity_rationale: |
  357 lines, NFKC + accent strip + Unicode homoglyph + Korean josa 12+ particle 정확
  처리 + 16개 transliteration pattern 적용. Planner / policy-compiler / exact-entity-metadata
  테스트로 광범위 커버. Determinism 검증된 regression 있음.

status: active
since: 2025-08
