id: agent.wine-search-pte
name: Wine Search PtE Orchestrator (Plan-then-Execute, NEW)
category: agent
summary: |
  ReAct 대체를 위한 Plan-then-Execute 오케스트레이터. query-analyzer → deterministic-router →
  execution-runner → synthesis-runner 4단 파이프라인. wine-search-schemas + execution-plan-schemas
  + synthesis-schemas로 각 단계 IO를 Zod-validated. fallback templates 포함.

maturity: 4
maturity_rationale: |
  Production-wired with feature flag (`WINE_SEARCH_ENABLED`). Full HTTP surface:
  POST /v1/wine-search 라우트 등록 (server.ts:390-394 + http-route-contract-catalog.ts:69),
  WineSearchRouteContract + WineSearchRequestSchema (200+ lines Zod-validated),
  WineSearchOrchestrator class implementation. DI 통합 — buildWineSearchContainerServices가
  feature flag 켜질 때 (`isWineSearchEnabled()`) container에 inject. Test coverage:
  4 e2e files (wine-search-api / -api-hell-http / -api-hell-adversarial /
  -api-hell-pipeline), integration test (wine-search.route.test.ts), bundle wiring
  test, feature flag test, +주변 application/wine-search/__tests__/. 4-단 PtE pipeline
  (query-analyzer → deterministic-router → execution-runner → synthesis-runner)
  모두 Zod-strict.

  2026-05-26 bench v14 RCA fix: synthesizer 가 raw `JSON.stringify(outcome.result)` 6000자
  cut 으로 인해 grounding payload 가 `…[grounding truncated]` 마커로 거의 항상 대체되던
  버그를 구조적으로 fix — 새 `synthesis-grounding-payload.ts` 가 compact
  `grounded_wines (N):` 리스트 + `tool_outcomes (M):` 메타데이터로 분리 serialize. SYSTEM
  prompt 에 contract 강화 ("when N>=1 you MUST cite at least one wine"). SynthesisRunner
  에 contract-violation guard 추가: candidate citations=0 AND prose mentions no grounded
  label → resynth 강제. 11개 회귀 케이스
  (test/regression/synthesizer-grounding-truncation.regression.test.ts) 추가.

  5는 18K bench scenario parity 입증 + ReAct cutover 시 가능.

status: active
