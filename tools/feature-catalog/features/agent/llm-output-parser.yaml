id: agent.llm-output-parser
name: LLM Output Parser (JSON Tool Call Extraction)
category: agent
summary: |
  Agent LLM 텍스트 출력에서 action/answer 추출. 5가지 recovery path (standard / bare /
  embedded / partial-batch / fallback) + input repair (unknown-key strip, malformed JSON
  re-wrap) + defect/repair metadata 기록.

maturity: 5
maturity_rationale: |
  SOTA++ property-based regression suite (23 fast-check properties, numRuns=100,
  i.e. ~2,300 randomized samples per invariant) lock the parser's structural
  contract: totality (never throws on arbitrary string / Korean / accented /
  emoji input), determinism (same input → identical output), mutual-exclusion
  of {answer, action, actions} on the success path, Unicode preservation
  byte-for-byte for Korean / 한글 query through the typed active retrieval-tool input
  path, schema strictness (unknown keys on KNOWN tools surface as
  `plannerRepair.repairedCandidates[*].removedUnknownKeys` — never silently
  accepted), parallel-batch totality (`actions` returned ⇒ length>0 ∧ no
  defect), idempotence on final-answer payloads, fence/whitespace tolerance,
  `estimateTokenCount` monotonicity Lipschitz-bound to
  `CHARS_PER_TOKEN_ESTIMATE`, `MAX_UNKNOWN_TOOL_INPUT_KEYS` truncation bounds,
  and `plannerDefect.rawText` audit-trail substring invariant. All thresholds
  bound to named constants per CLAUDE.md rule 15. The remaining technical
  debt (manual JSON parsing vs. provider-native tool_use blocks) is now a
  migration choice, not a quality gap — the structural contract is provably
  pinned.

status: deprecated  # Cutover 3.0.0 (2026-05-23): replaced by wine-search PtE
