id: agent.tool-execution-phase
name: Tool Execution Phase (Batch + Sequential + Drinkability Follow-up)
category: agent
summary: |
  Planner 결정에 따라 tool을 실행. parallel batch (tool-batch-policy 검증) / single /
  drinkability follow-up 분기. refinement hint 주입, evidence frame 태깅,
  budget 기록.

maturity: 4
maturity_rationale: |
  Unit test 1개 + regression 4개 (parallel-tools, evidence-frame-emission,
  inner-surface-contract, tool-execution-phase-properties — fast-check
  numRuns=100)로 dispatch order / bounded fan-out / no double-issue /
  batch isolation / terminal-state propagation / NFC preservation
  (Korean tool inputs) / prototype-pollution rejection (`__proto__`,
  `constructor`, `toString`, `hasOwnProperty`, `prototype`, `valueOf`,
  `isPrototypeOf`, empty) — 7개 invariant이 property-based로 잠겨 있음.
  MAX_TOOLS_PER_BATCH, KNOWN_AGENT_TOOL_NAMES 같은 SSoT 상수에 직접
  엮어 magic-number drift 자동 감지. 남은 5점 차이: policy 모듈 1329 lines
  분리/축소 (lookup-strategy-selector / overconstraint-detector /
  normalize)와 drinkability follow-up explicit handler 추출이 끝나야
  SOTA++ 완전체.

status: active
since: 2025-09
last_reviewed: 2026-05-21
owner: core

surfaces:
  - "Internal (called from react-orchestrator)"

key_files:
  - src/application/agent/agent-tool-execution-phase.ts
  - src/application/agent/agent-tool-execution-policy.ts
  - src/application/agent/agent-tool-execution-result-policy.ts
  - src/application/agent/agent-tool-execution-support.ts
  - src/application/agent/tool-batch-policy.ts

tests:
  unit:
    - test/unit/application/agent/agent-tool-execution-phase.test.ts
  regression:
    - test/regression/agent-parallel-tools.regression.test.ts
    - test/regression/agent-tools-evidence-frame-emission.regression.test.ts
    - test/regression/agent-tools-inner-surface-contract.regression.test.ts
    - test/regression/tool-execution-phase-properties.regression.test.ts

depends_on:
  - agent.tool-batch-policy
  - agent.semantic-contract-compiler

related_rfcs:
  - docs/RFC-016.md

known_limitations:
  - "Policy 모듈 1329 lines — overweight"
  - "Drinkability follow-up이 phase에 임베드 (분리 필요)"
  - "Tool result synthesis가 tool-specific observation 파싱에 결합"

next_steps:
  - "Policy를 lookup-strategy-selector / overconstraint-detector / normalize 로 분리"
  - "Drinkability follow-up을 explicit post-tool handler로 추출"

tags:
