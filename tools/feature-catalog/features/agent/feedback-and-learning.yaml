id: agent.feedback-and-learning
name: Feedback Processing & Learning Pipeline
category: agent
summary: |
  사용자 시그널 (CTR, dwell, abandonment) 수집 + position debias + TTL enforce →
  judgment 변환 + alias-proposer + promotion-gate. LTR 재학습용 데이터 + auto-rollback
  결정.

maturity: 3
maturity_rationale: |
  Production wired in container-learning.ts: PgFeedbackStore (PG-backed) +
  FeedbackProcessor + FeedbackTTLEnforcer 모두 composed. POST /v1/feedback 핸들러가
  `deps.feedbackStore.saveFeedback(signal)` 직접 호출 (route file). feedbackIngestEnabled
  toggle은 `!killSwitch.learning && feedbackStore !== null`로 활성화 — 즉 PG가
  설정되어 있고 학습 kill-switch off일 때 ingest 작동. Idempotency key 처리 (UUID 검증).
  4 위해서는 LTR 재학습 cron 통합 + online quality monitor가 emit 외에 actionable
  alerting + auto-rollback이 actual deploy에 연결 필요.

status: active
since: 2025-11
last_reviewed: 2026-05-21
owner: core

surfaces:
  - "HTTP: POST /v1/feedback"
  - "Internal learning loop"

