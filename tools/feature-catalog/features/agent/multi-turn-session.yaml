id: agent.multi-turn-session
name: Multi-Turn Agent Sessions (server-managed history custody)
category: agent
summary: |
  서버 관리 멀티턴 agent 세션. `POST /v1/agent/sessions` (create) +
  `POST /v1/agent/sessions/:sessionId/turns` (append turn). AgentSessionService가
  history custody/transcript(user + synthesized assistant answer)를 소유하고,
  durable SQLite store(AgentSessionStorePort)가 idempotency·optimistic concurrency·
  TTL을 보장. single-shot run과 동일한 orchestrator를 공유 — 차이는 history custody와
  persistence뿐.

maturity: 4
maturity_rationale: |
  Production-wired (T-MTA-01..07, 2026-05-30). AgentSessionService가 모든 세션 로직
  (replay / version-conflict / stitch / transcript / append)을 소유하고 HTTP route +
  CLI facade는 thin wire-mapper. Durable store는 `node:sqlite`(DatabaseSync) 기반
  SqliteAgentSessionStore — `AGENT_SESSION_DB_PATH` 설정 시에만 wire되고, 없으면
  fail-closed(503). process-local store는 test-seam으로 격하. AgentSessionStorePort는
  application 타입만 의존(interface/http 비의존). 세션 메시지 shape는 canonical
  `AgentMessageSchema`(SSoT). 세션 범위 runtime-state seam(AgentRuntimeSessionState)으로
  provider continuation/cache state가 singleton adapter가 아닌 session에 귀속.

  Test coverage: SQLite store(idempotent create incl. ON CONFLICT race, idempotent
  append, version_conflict, TTL expiry, JSON round-trip), AgentSessionService
  (transcript user+assistant, prior-history feed, replay no-rerun, conflict no-rerun,
  history windowing으로 long-session brick 방지), HTTP route(create/turn/replay/404/409
  RFC-014 envelope), local↔remote parity(run/start/turn), provider no-singleton guard.

  2-round 병렬 adversarial audit로 hardening된 항목: (1) stitched history가 128 cap
  초과 시 SQLite read/wire 검증 throw로 ~64턴 후 세션 brick → 가시적 windowing으로 fix.
  (2) loop trim이 prior-history 환경에서 진짜 anchor(현재 질의)를 evict → anchor를
  reference로 보존. (3) Anthropic adapter가 windowing 후 leading assistant turn에서 400
  → 선두 non-user turn drop. (4) createSession 교차프로세스 UNIQUE race → ON CONFLICT.

  5는 멀티턴 scale의 eval/bench parity 입증 + distributed(비단일파일) durable backend +
  web UI 세션 surface 정착 시 가능.

status: active
since: 2026-05
last_reviewed: 2026-05-30
owner: core

surfaces:
  - "HTTP: POST /v1/agent/sessions (create session, idempotent on client_session_id)"
  - "HTTP: POST /v1/agent/sessions/:sessionId/turns (append turn, optimistic concurrency)"
  - "CLI: agent session start / agent session turn (local + remote parity)"
  - "Web: api.agent.sessions.create / .turn"

key_files:
  - src/application/wine-search/agent-session-service.ts
  - src/application/wine-search/port/agent-session-store.port.ts
  - src/application/wine-search/agent-runtime-session-state.ts
  - src/infrastructure/db/agent-session-store.ts
  - src/config/agent-session-store.ts
  - src/interface/http/routes/agent.route.ts
  - src/interface/http/schemas/agent.schema.ts
  - src/config/container.ts

tests:
  unit:
    - src/application/wine-search/__tests__/agent-session-service.test.ts
    - src/infrastructure/db/__tests__/agent-session-store.test.ts
    - src/infrastructure/ai/__tests__/provider-no-singleton-state.test.ts
  integration:
    - test/integration/http/routes/agent.route.test.ts
  regression:
    - test/regression/multi-turn-agent-banned-surfaces.regression.test.ts

depends_on:
  - agent.wine-search-pte

related_rfcs:
  - docs/plans/may-30-multi-turn-agent/tickets/README.md

known_limitations:
  - "Durable backend가 SQLite 단일 파일 — 다중 인스턴스 공유 시 같은 파일을 봐야 함 (distributed store 미수립)"
  - "멀티턴 scale의 eval/bench parity 미측정"
  - "history는 가시적 windowing(최근 128 메시지)으로 bound — 초장기 대화의 오래된 turn은 planner 입력에서 제외됨"
  - "per-turn context override는 wire에 존재하나 session context가 우선 (turn context no-op)"

next_steps:
  - "멀티턴 scenario bench/eval parity 측정"
  - "distributed durable backend(예: PG/Redis) adapter 추가 검토"
  - "web UI에 세션 대화 흐름 통합"

