id: agent.semantic-contract-compiler
name: Semantic Contract Compiler (Pre-loop Intent Analysis)
category: agent
summary: |
  Loop 전 LLM 호출로 query의 intent (recommendation / exact_lookup / food_pairing /
  comparison / knowledge / off_domain) + preference axis + confidence를 Zod-validated
  contract으로 산출. tool 선택 + observation synthesis 가이드.

maturity: 5
maturity_rationale: |
  Zod schema (max 768 tokens) + 3 regression 게이트: (1) token accounting invariant —
  LLM이 budget을 소비한 모든 호출에 대해 state.totalInputTokens/totalOutputTokens
  누적, (2) validation fence invariant — malformed JSON / unknown intent enum /
  preservedSurface mutation / empty response 모든 케이스에서 compileIfNeeded는
  partial object가 아니라 정확히 `undefined`를 반환 (한국어 + ASCII bypass 양쪽 검증),
  (3) property-based invariants (fast-check, numRuns=100, seed-pinned): Zod 거절
  idempotence + token accounting monotonicity + Korean NFC surface preservation
  + verbatim preservedSurface 동치 + calibrated abstention threshold
  (MIN_SEMANTIC_CONTRACT_CONFIDENCE_THRESHOLD=0.5; Mozannar & Sontag, NeurIPS 2020
  selective-prediction cut-off) + empty inferredPreferences 허용. Multi-intent
  케이스 (recommendation + food-pairing obligation) merge-through 검증, strict()
  unknown-key rejection, 빈/공백 query는 admission 단계에서 short-circuit.

status: active
since: 2025-10
last_reviewed: 2026-05-21
owner: core

surfaces:
  - "Internal (pre-loop in react-orchestrator)"

key_files:
  - src/application/agent/agent-semantic-contract.ts
  - src/application/agent/agent-query-execution-contract.ts

tests:
  regression:
    - test/regression/agent-semantic-contract-token-accounting.regression.test.ts
    - test/regression/agent-semantic-contract-validation-fence.regression.test.ts
    - test/regression/agent-semantic-contract-properties.regression.test.ts

depends_on:
  - infra.chat-llm-port
  - nlu.recipient-situation-profile
  - nlu.pairing-extraction

related_rfcs:
  - docs/RFC-016.md
  - docs/RFC-009.md

known_limitations:
  - "Threshold (0.5)는 schema midpoint default; gold abstention 라벨로 sweep 필요"
  - "Multi-intent: 현재 단일 intent enum + obligation flags로 표현; 진정한 multi-label discriminated union 미도입"

next_steps:
  - "Gold abstention 라벨 수집 → MIN_SEMANTIC_CONTRACT_CONFIDENCE_THRESHOLD ROC sweep"
  - "Discriminated-union intent (recommendation ∧ food_pairing 동시 슬롯) 스키마 확장"

tags:
