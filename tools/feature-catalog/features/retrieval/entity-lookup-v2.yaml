id: retrieval.entity-lookup-v2
name: Entity Lookup V2 (Dedicated Resolution Stack)
category: retrieval
summary: |
  Single kernel: `lookup-authority.ts` → `EntityLookupV2UseCase` for HTTP/agent/CLI,
  eval-only autocomplete projection, and search-entity bridge. `POST /v2/entity-lookup`
  admission/concept gate + multi-channel provenance + calibrated-abstain 4-state
  (resolved|ambiguous|failed|redirect_discovery). Precision-first: abstain over wrong-positive.
target_architecture: |
  Entity resolve SSoT is one kernel: `src/config/lookup-authority.ts` wires
  `EntityLookupV2UseCase` and is the shared entry for HTTP (`POST /v2/entity-lookup`),
  agent tools, CLI, and eval-only autocomplete projection. Autocomplete is not a
  parallel resolver pipeline and has no live HTTP route after the V2 cutover.
  Legacy `POST /v1/entity/resolve` was removed — ResolveResponse shape is kept
  only as a mapping-only regression rail (`executeResolveViaEntityLookupV2`).

maturity: 4
maturity_rationale: |
  **2026-06-10 (KIL + planner hardening).** In-memory substrate parity: document alias
  materialization, Double Metaphone recall, romanee-conti-2015 fixture alignment.
  KIL noisy benchmark recall@3 ~0.95 (phonetic/producer_label/accent floors green).
  Planner: partial producer-label identity posture + ontology-only fuzzy recovery.
  LookupDecisionEngine: unique jamo_phonetic singleton witness (symmetric to fuzzy).
  Identity exactness tier `alias_phonetic` wired through entity-route ranked results,
  decision calibration-trust + noisy-short-query bypasses, and PG `phonetic_keys`
  recall substrate (migration 034).

  **2026-06-17 (ELV2 closeout).** Curation publish→snapshot ETL (033, pin convergence,
  publish-time materialize). Silent-skip counters for scope-graph/retrieval degradation.
  family_graph SSoT = snapshot EntityScopeGraphPort (PgFamilyGraph deprecated for lookup).
  Meta gates: runtime-registry CLI parity + active-pointer proof. Ops-web reject +
  abbreviation alias parity. line/vintage graph + candidate-projection tests.

  **2026-06-10 (Phase 0–5).** 단일 커널: views/ambiguity dedup, resolverProjectionLookup-only
  hydration, LookupDecisionEngine, exact-safe fast path, cutover meta lane. `/v2/entity-lookup`
  only. maturity 5 미달: alias registry v2 심화 + long-tail stretch (T-ELV2-08).

  **2026-06-03.** EntityPicker curation UX, ambiguity/suppression submit, ops playground.

  **2026-06-02 (T-ELV2-07).** Ops inspect + curation write plane (X-Debug-Key /
  X-Ops-Write-Key), proposal lifecycle SSoT, Next.js `/ops/*`, migration 030.

  **T-01~05 코어.** T-ELV2-01 contract, T-ELV2-02 concept gate, T-ELV2-04 multi-channel
  provenance, T-ELV2-05 calibrated abstain — DoD #1/#3/#4/#5 충족.

  maturity 4 잔여: (a) 다채널 timed native retrieval은 `LookupCandidateRetrievalPort`
  seam 다음 단계, (b) parity gate는 drift만 막고 long-tail quality를 보장하지 않음,
  (c) DoD #2 alias registry v2 심화 substrate 미완.

