known_limitations:
  - "다채널 provenance는 기존 anchor recall 재투영 — 독립 timed channel runtime(per-channel native score) 미구현 (LookupCandidateRetrievalPort seam)"
  - "shadow-compare live runner + hotset eval 실측 미완 — V1 대비 우위 미증명 (DoD #7, cutover 금지)"
  - "DoD #2: dedicated alias registry v2 + dom perignon coverage report 미구현 (T-ELV2-03)"
  - "DoD #6: trusted operator plane + curation write plane 미구현 (T-ELV2-07)"
  - "family graph / ambiguity graph 미구현 (T-ELV2-06) — clarification은 현재 candidate label 기반"
  - "V1 /v1/lookup/wine가 여전히 authority — cutover는 shadow proof 이후"

next_steps:
  - "T-ELV2-04 심화: LookupCandidateRetrievalPort 뒤 독립 timed 채널 runtime + native score"
  - "T-ELV2-08: live shadow runner(run-lookup-v2-shadow-compare.ts) wiring + hotset eval 실측"
  - "T-ELV2-03: dedicated alias registry v2 + hot-entity coverage report (dom perignon hole)"
  - "T-ELV2-06: family/ambiguity graph로 graph-backed clarification"
  - "T-ELV2-07: trusted operator read/curation plane + web console"

