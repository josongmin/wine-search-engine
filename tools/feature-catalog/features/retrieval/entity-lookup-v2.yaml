known_limitations:
  - "shadow-compare live runner + hotset eval 실측 미완 — V1 대비 우위 미증명 (DoD #7, cutover 금지)"
  - "DoD #2: dedicated alias registry v2 schema/심층 curation substrate 미완 (T-ELV2-03 심화) — 현재 write plane은 기존 alias_proposals + 신규 ambiguity/suppression staging까지"
  - "curation publish는 staging 마커만 — runtime 반영은 snapshot ETL 소비 경로에 의존(직접 runtime write 없음, RFC §5 의도)"
  - "V1 /v1/lookup/wine가 여전히 authority — cutover는 shadow proof 이후"

