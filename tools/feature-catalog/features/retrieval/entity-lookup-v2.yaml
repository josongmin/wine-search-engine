known_limitations:
  - "parity rail은 authority drift를 막지만 long-tail quality/coverage green을 의미하지는 않음"
  - "legacy approved abbreviation rows: coverage-health exposes `legacy_approved_abbreviation_backlog`; ops publish still required for materialization tracking"
  - "curation publish는 staging 마커 — runtime 반영은 snapshot build→publish 파이프라인 재실행 필요"
  - "family_graph runtime source는 snapshot `lookup_scope_graph_runtime` (PG `entity_family`/`PgFamilyGraph`는 lookup lane 미배선). family edge count=0이면 채널은 fire하나 hitCount=0"
