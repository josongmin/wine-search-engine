id: retrieval.comparison-retrieval
name: Comparison Retrieval (Parallel Dual-Leg)
category: retrieval
summary: |
  두 wine 비교 시나리오에서 query_a / query_b 두 leg를 병렬 hybrid retrieval로 실행하고
  결과를 per-side로 머지. shared-constraints로 양쪽 leg에 공통 필터 적용.

maturity: 4
maturity_rationale: |
  HONEST 4. compare-retriever 코어를 fast-check property suite (numRuns=100,
  9 tests)로 락업: determinism (동일 anchor+index → deep-equal), order-independence
  (permuted index hit order → identical candidates), bounded fan-out (≤ limit,
  ≤ FETCH_MULTIPLIER×limit over-fetch), anchor self-exclusion (anchor가 자기 비교
  집합에 안 나타남), NaN/Infinity score safety (never throws, NaN가 finite보다
  상위 안 됨), per-entity independence (두 anchor의 own-exclusion disjoint),
  Korean NFC/NFD anchor 동치 lexical leg, empty/single safety, no private RRF
  (compare candidate가 sparseRawScore만 carry, fabricated fusion total 없음 —
  rule 30). 남은 maturity 5 과제: cross-leg balance scoring + comparison-aware
  reranking (product gap, 코어 retrieval 결함 아님).

status: active
since: 2025-09
last_reviewed: 2026-05-21
owner: core

surfaces:
  - "Agent tool: compare_wines"
  - "HTTP: POST /v1/search (decomposed)"

key_files:
  - src/domain/retrieval/service/compare-retriever.ts
  - src/application/search/compare-tool-shared-constraints.ts
  - src/application/search/decomposed-search-adapter.ts

tests:
  regression:
    - test/regression/comparison-retrieval-properties.regression.test.ts

depends_on:
  - retrieval.hybrid-search
  - nlu.decomposition-detection

related_rfcs:
  - docs/RFC-010.md

known_limitations:
  - "Cross-leg balance scoring 없음 — 한쪽 leg 매칭 0이어도 silently 진행"
  - "Comparison-aware diversity / reranking 부재"

next_steps:
  - "Pairwise balance score 도입 (양쪽 leg 결과 분포 패널티)"
  - "Side-aware reranking (e.g. 사용자 비교 의도에 맞춘 attribute 부각)"

tags:
  - parallel-execution
  - agent-tool
  - comparison
