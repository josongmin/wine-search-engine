id: retrieval.retrieval-plan-builder
name: Retrieval Plan Builder
category: retrieval
summary: |
  Query intent + constraint + cold-start signal로 multi-stage retrieval 계획 구성.
  channel 선택, soft vs hard filtering, relaxation 순서, ANN target hit 결정.
  Query difficulty estimator + retrieval profile 입력으로 plan 산출.

maturity: 4
maturity_rationale: |
  핵심 인프라로 hybrid retrieval executor / constraint-compiler / planner에 wired.
  buildRetrievalPlan의 plan-level 불변식을 property-based regression (numRuns=100)으로 고정:
  determinism, order-independence (boost를 content-only comparator로 정렬 — 입력 순서 무관),
  idempotence, constraint conservation (soft/inferred → boost 1:1, silent drop 없음),
  bounded fan-out (MAX_BOOSTS_PER_TIER=64, weakest-first drop), weight invariant
  (모든 weight clamp to [BOOST_WEIGHT_MIN, BOOST_WEIGHT_MAX], NaN/∞ 차단), NFC preservation
  (한글/accented Latin string·array 값 정규화), empty→typed minimal plan.
  INFERRED_CONSTRAINT_WEIGHT_MULTIPLIER / cap / weight bound는 SOURCE에서 export (rule 13).
  SENSORY_PRIOR_ATTRIBUTES를 SSoT 상수로 추출해 plan-builder·extract-sensory-priors 중복 제거.
  5 미달 사유: cost-aware relaxation 순서·channel mix 온라인 학습 부재, plan quality는
  여전히 downstream search metric으로 간접 측정 (직접 instrumentation 없음).

status: active
since: 2025-10
last_reviewed: 2026-05-21
owner: core

surfaces:
  - "HTTP: POST /v1/search (internal)"

key_files:
