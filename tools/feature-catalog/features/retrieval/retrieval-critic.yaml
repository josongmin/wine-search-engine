id: retrieval.retrieval-critic
name: Retrieval Critic (Quality Gate + Adaptive Relaxation)
category: retrieval
summary: |
  Post-retrieval에서 candidate 품질을 평가해 constraint relaxation 또는 retry를 결정.
  feature flag (RETRIEVAL_EXECUTOR_CRITIC) 게이트 + retry cap + 텔레메트리 통합. 저품질
  결과가 ranking 단계로 흘러 들어가는 것을 차단.

maturity: 4
maturity_rationale: |
  Integration test (retrieval-critic-flag-on) + regression 2개 (decision + retry-cap)로
  결정 로직과 retry 상한 모두 게이트. ADR-015에 따른 retry count 반영, 텔레메트리 hook
  완비. 사용자 feedback loop 부재로 5는 못 됨.

status: active
since: 2025-11
last_reviewed: 2026-05-21
owner: core

surfaces:
  - "HTTP: POST /v1/search (internal)"

key_files:
  - src/domain/retrieval/service/retrieval-critic.ts

tests:
  e2e:
    - test/integration/retrieval-critic-flag-on.integration.test.ts
  regression:
    - test/regression/retrieval-critic-decision.regression.test.ts
    - test/regression/retrieval-critic-retry-cap.regression.test.ts

depends_on:
  - retrieval.hybrid-search
  - retrieval.retrieval-plan-builder

related_rfcs:
  - docs/RFC-015.md

known_limitations:
  - "Decision threshold 학습 불가능"
  - "사용자 클릭/피드백 feedback loop 부재"
  - "Cross-mode 완화 (entity → hybrid 등) 미지원"

next_steps:
  - "사용자 신호 기반 threshold 학습"
  - "Cross-mode relaxation 도입"

tags:
  - quality-gate
  - fallback
  - production-eval-coverage
