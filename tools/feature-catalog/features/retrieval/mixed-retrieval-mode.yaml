id: retrieval.mixed-retrieval-mode
name: Mixed Retrieval Mode (Anchor + Filter Hybrid)
category: retrieval
summary: |
  기준 wine에 anchor하고 dense similarity + structured filter를 동시 적용하는 mode.
  "이거랑 비슷한", "스타일이 비슷한" 류 쿼리에 사용. retrieval_mode='mixed'로 라우팅.

maturity: 4
maturity_rationale: |
  Vespa similar-retrieval 인프라 작동, candidate-pool에 통합. 기본 anchor + ANN 시나리오는
  안정. 2026-05-21: dense+sparse 혼합 fusion 코어(FusionService.fuse)에 대해 numRuns=100
  property 회귀 9종 추가 — 결정성, RRF SSoT(@shared/utils/rrf.ts 단일 출처, private
  1/(k+rank) 중복 없음), lane 내 순서 permutation-stability, NaN/±Infinity 점수 안전성,
  exact-equality tie-break(entityId 오름차순) 결정성, 출력 상한(named const) bound,
  channel-set 보존(엔티티 불변·candidateSources 정확), empty-channel 안전성, weight
  monotonicity. 한글 라벨/쿼리("이거랑 비슷한", "스타일이 비슷한") payload 통과 검증 포함.
  코드 변경은 불필요했음 — fusion 코어는 이미 SSoT·??·NaN-guard 충족. 5점은 feature
  고유 한계(anchor decay / cross-anchor dedup / 전용 similarity 스코어링 부재)가 남아
  보류.

status: active
since: 2025-10
last_reviewed: 2026-05-21
owner: core

surfaces:
  - "Internal retrieval planner mode: mixed"
  - "No public primitive surface; composed behind agent/search planning"

key_files:
  - src/infrastructure/vespa/vespa-similar-retrieval.ts
  - src/domain/retrieval/service/candidate-pool.ts
  - src/domain/query/model/retrieval-mode.ts

tests:
  regression:
    - test/regression/mixed-retrieval-mode-properties.regression.test.ts

depends_on:
  - retrieval.hybrid-search
  - nlu.anchor-extraction

related_rfcs:
  - docs/RFC-012.md

known_limitations:
  - "Anchor decay / 시간 가중치 부재"
  - "Anchor-aware diversity penalty 부재 — anchor 자체가 top1로 자주 반환됨"

next_steps:
  - "Anchor 제외 옵션 (e.g. 'X 제외하고 비슷한 거')"
  - "전용 similarity 스코어링 프로필 (현재 hybrid fusion 가중치 재사용)"

tags:
  - vespa-similar
  - anchor-based
  - hybrid
