id: retrieval.cache-policy
name: Retrieval Cache Policy
category: retrieval
summary: |
  Search 결과 caching 정책. 어떤 쿼리를 caching할지 (eligibility), TTL, invalidation.
  embedding cache + phrase cache + query cache의 정책 layer.

maturity: 4
maturity_rationale: |
  Cache 정책은 두 결정 layer 로 구성: (1) eligibility/bypass 결정
  (`cache-policy.ts`, pure-function) 와 (2) cache-KEY + TTL 도출
  (`cache-key.ts` + SSoT `cache-ttl-config.ts`). 이전 maturity 3 은 (1) 만
  property 수준으로 고정했고, 실제 retrieval 결과 버킷팅을 결정하는 (2) 의
  핵심 불변식은 example-based 테스트(`cache-key-collision`)로만 sampling
  되어 있었다. Maturity 4 승격의 핵심:

    1. **구조적 버그 수정 — NFC cache-key fragmentation.** `QueryCacheKeyBuilder`
       /`EmbeddingCacheKeyBuilder` 가 query/constraint/expansion/snapshotId/
       embedding text 를 Unicode 정규화 없이 해시했다. 업스트림 정규화기는
       NFC/NFKC/NFD 를 제각각 적용(`search-constraint-extractor`,
       `static-ambiguity-dictionary`, `recipient-situation-profile` 등)하므로,
       동일 한글 쿼리("위" composed U+C704 vs decomposed U+110B U+1171)가 서로
       다른 키로 해시 → 하나의 의미 쿼리가 두 버킷으로 분열(silent
       fragmentation: 잘못된 hit 는 없으나 hit 를 영구히 놓침). 이제 builder 가
       해시 경계(`hashDeterministic`)와 정렬·length-prefix 인코딩 단계 모두에서
       NFC 로 canonical 화하여 invariant 를 **builder 가 소유**. NFKC 가 아닌 NFC
       선택(호환 문자 폴딩으로 의미 구분이 무너지는 역방향 회귀 방지)을 주석으로
       명시.
    2. **Property-based 회귀 고정 (numRuns=100)** —
       `test/regression/cache-policy-properties.regression.test.ts`: 결정성,
       constraint/expansion 순서 독립성(set 의미), NFC/NFD 폼 불변성(한글+accented
       Latin), snapshot/locale/soft-vs-hard collision-freedom, 빈 set·whitespace·
       -0/0·빈 문자열 edge key, 그리고 TTL 이 named SSoT 상수(`CACHE_TTL_SECONDS`)
       에서 도출됨을 고정. (참고: zero-TTL 보존 테스트는 `??` vs `||` 연산자
       계약 수준이며, source 코드가 해당 패턴을 사용함을 assert 하지는 않음.)
    3. (유지) Hit-distribution observability counter + reason enum SSoT 정렬은
       maturity 3 에서 도입된 그대로.

  남은 한계 (maturity 5 의 과제): invalidation 정책은 여전히 부분적으로 ad-hoc
  (snapshot-bound TTL + 명시적 invalidation API 의 완전 정형화 미완). 분포
  카운터는 process-local — 다중 인스턴스 집계는 별도 export pipeline 필요.
  localeCompare 기반 정렬은 host ICU collator 에 의존(동일 호스트 내 결정적이나
  크로스-호스트 동일 ICU 가정).

