id: etl.bronze-data-connector
name: Vivino Bronze Data Connector
category: etl
summary: |
  Vivino API에서 wine_pdp_snapshot 데이터 fetch + bronze NDJSON 저장. periodic refresh
  오케스트레이션. silver ETL의 입력.

maturity: 4
maturity_rationale: |
  HONEST 4. HTTP fetch resilience (설정 가능한 retry budget
  BRONZE_FETCH_MAX_RETRIES_DEFAULT=3, exponential full-jitter backoff
  BRONZE_FETCH_BASE_BACKOFF_MS=1000ms ~ BRONZE_FETCH_MAX_BACKOFF_MS=30000ms,
  5xx/429/transient retry, 4xx no-retry) + 주입 가능한 clock·RNG·sleep·fetch.
  fast-check property suite (numRuns=100, 13 tests)로 boundary invariants 락업:
  P1 determinism (same body + injected clock → byte-identical snapshot envelope),
  P2 schema enforcement (BronzeBodySchema fail → schema-error, never ok; Korean
  producer NFC round-trip), P3 bounded size (BRONZE_FETCH_MAX_BODY_BYTES named
  positive int cap, body>cap → body-too-large), P4 encoding stability
  (normalizeBronzeText idempotent, BOM 정확히 1회 strip, Korean NFD→NFC 재구성),
  P5 path-traversal (file:// `..`/NUL reject, http(s) pass), P6 empty/malformed
  body 안전. 남은 maturity 5 과제: cron 자동화, freshness SLA monitor+alert,
  Retry-After 헤더 honor — 모두 orchestration/ops gap이지 connector code 결함 아님.

status: active
since: 2025-08
last_reviewed: 2026-05-21
owner: core

surfaces:
  - "CLI: pnpm vivino:bronze"
  - "Library: fetchVivinoSnapshot()"

key_files:
  - tools/bronze-vivino-data-connector/fetch-vivino-snapshots.ts

tests:
  regression:
    - test/regression/bronze-data-connector.regression.test.ts
    - test/regression/bronze-data-connector-properties.regression.test.ts

depends_on: []

related_rfcs: []

known_limitations:
  - "Schedule 자동화 없음 (cron / orchestrator 미연결)"
  - "Snapshot freshness SLA 모니터 미비 (메타데이터는 기록되지만 alert 없음)"
  - "Rate-limit Retry-After 헤더는 아직 미반영"

next_steps:
  - "Cron 자동화"
  - "Freshness SLA 모니터 + alert 연결"
  - "Retry-After 헤더 honor (현재는 균일 exponential backoff)"

