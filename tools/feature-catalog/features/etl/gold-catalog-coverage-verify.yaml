id: etl.gold-catalog-coverage-verify
name: Gold Catalog Coverage Verify
category: etl
summary: |
  Golden query ground-truth 엔티티가 published search snapshot에 모두 존재하는지 검증.
  데이터 손실 / catalog mismatch를 promotion 전에 차단. CI gate.

maturity: 5
maturity_rationale: |
  Set-theoretic coverage(golden ⊆ snapshot)를 순수 함수 computeCatalogCoverage로
  추출하고 property-based invariant(fast-check, numRuns:100)로 고정: ratio ∈ [0,1],
  full-coverage⇒missing=[]·ratio=1.0, missing detection, empty-golden vacuous
  coverage, determinism(5x), Korean entity_id verbatim 보존, snapshot 추가 시
  monotone(coverage 비감소). pre-publication CI gate로 운영. attribute-level
  coverage 검사는 여전히 미적용(known limitation).

status: active
since: 2025-10
last_reviewed: 2026-05-21
owner: core

surfaces:
  - "CLI: pnpm etl:verify-gold-catalog-coverage"

key_files:
  - scripts/etl/verify-gold-catalog-coverage.ts

tests:
  regression:
    - test/regression/gold-catalog-coverage-properties.regression.test.ts

depends_on:
  - eval.golden-set
  - etl.search-snapshot-build

related_rfcs: []

known_limitations:
  - "엔티티 존재만 검사 — attribute completeness 미검사"

next_steps:
  - "Attribute-level coverage 확장 (e.g. 모든 와인에 price_band 존재 등)"

tags:
  - data-quality
  - coverage
  - ci-gate
