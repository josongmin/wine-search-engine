  - scripts/etl/artifact-contract.ts

tests:
  regression:
    - test/regression/silver-validation.regression.test.ts
    - test/regression/silver-validation-properties.regression.test.ts
  unit:
    - test/unit/etl/validate-silver.test.ts

depends_on:
  - etl.vivino-to-silver

related_rfcs: []

known_limitations:
  - "Schema 가 현재 v1 단일 — multi-version 마이그레이션 경로는 정책으로만 문서화"

next_steps:
