id: etl.doc-queries-generation
name: Synthetic Doc Queries Generation
category: etl
summary: |
  Wine document (canonical label, region, producer, grape, pairing 등) 구조화 입력으로
  Doc2Query (Nogueira 2019) 합성 쿼리 N=15 슬롯 생성. BM25 `synthetic_queries` 전용
  필드로 라우팅되어 원문 IDF 오염 없이 가중치 독립 튜닝 가능. Korean alias 주입으로
  romanization hallucination 차단.

maturity: 3
maturity_rationale: |
  - 명명 상수 + 도메인 근거 bound: `DOC_QUERY_MIN_CHARS=3`, `DOC_QUERY_MAX_CHARS=200`,
    `DOC_QUERIES_PER_DOC=15`, `DOC_QUERIES_SCHEMA_VERSION='1'` (CLAUDE.md 규칙 15).
  - 정규화 파이프라인 (NFC + trim + 공백/대소문자 무시 canonical dedup) 으로 LLM의
    근접 중복 슬롯 emission (`Opus One Napa` vs `OPUS ONE  NAPA`) 단일 결과로 수렴.
  - JUST inside / JUST outside bound 경계 테스트 + 한글 NFC 안정성 테스트 + 한·영 혼합
    배치 + AbortSignal 사전 점검 + malformed LLM 출력 graceful skip 회귀 18건.
  - 모델 + content hash + schema_version 으로 idempotent skip; rule drift 감지 가능.
  Long-tail 사용자 의도 적용 / popularity 가중치 / online eval 통합은 추후 단계.

status: active
since: 2025-09
last_reviewed: 2026-05-21
owner: core

surfaces:
  - "CLI: pnpm etl:doc-queries"

key_files:
