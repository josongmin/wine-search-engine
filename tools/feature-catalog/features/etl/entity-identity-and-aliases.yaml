id: etl.entity-identity-and-aliases
name: Entity Identity & Multilingual Aliases ETL
category: etl
summary: |
  Canonical entity identity 결정 (snapshot-entity-identity), transliteration alias 생성
  (generate-transliteration-aliases), NL mapping 생성 (generate-nl-mappings), canonical
  entity graph ingest (ingest-canonical-entity-graph).

maturity: 5
maturity_rationale: |
  SOTA++. 4-step 파이프라인 + fast-check property-regression (numRuns=100)
  17 tests로 invariants 락업. identity determinism (5× 반복 동일성),
  identity sensitivity (canonicalLabel/producer/vintage 변경 → 다른 hash),
  alias closure (canonical ∈ aliases), NFC stability (Korean producers
  through identity computation), alias dedup (case-folded NFC uniqueness),
  bounded alias count by named MAX constant, empty-record typed error,
  Korean producer + accented Latin (Château / Müller) coverage. accent
  variant (Château vs Chateau)는 alias-layer 책임으로 명시 — identity-resolution
  은 hash-based이며 accent fold 하지 않음 (정책 boundary 테스트로 잠금).
  기존 entity-identity-snapshot regression + 17 새 property test로 2층 락업.

status: active
since: 2025-09
last_reviewed: 2026-05-21
owner: core

surfaces:
  - "CLI: pnpm etl:transliteration / etl:doc-queries 등"

key_files:
  - scripts/etl/snapshot-entity-identity.ts
  - scripts/etl/generate-transliteration-aliases.ts
  - scripts/etl/generate-nl-mappings.ts
  - scripts/etl/ingest-canonical-entity-graph.ts

tests:
  regression:
    - test/regression/entity-identity-snapshot.regression.test.ts
    - test/regression/entity-identity-and-aliases-properties.regression.test.ts

depends_on:
  - korean-i18n.transliterator
  - korean-i18n.curated-alias-catalog

related_rfcs: []

known_limitations:
  - "통합 gate 없음 (각 단계 수동)"
  - "Identity-resolution은 accent를 fold 하지 않음 — alias-layer가 bridging 책임"

next_steps:
  - "End-to-end pipeline orchestrator"
  - "Identity resolution: accent-folding 정책 결정 (alias-layer 위임 vs. resolver 통합)"

tags:
  - entity-identity
  - aliases
  - data-pipeline
