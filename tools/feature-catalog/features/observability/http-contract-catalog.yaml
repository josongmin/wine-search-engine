id: observability.http-contract-catalog
name: HTTP Route Contract Catalog (SSoT)
category: observability
summary: |
  26개 declared HTTP route의 method / URL / operationId / 상태 코드 / response shape
  중앙 등록부. register-contract-route + http-route-contract-catalog. OpenAPI export +
  http-contracts CI gate의 SSoT. SemVer 2.0 카탈로그 버전 + sha256 구조 fingerprint로
  breaking-change tripwire 제공.

maturity: 5
maturity_rationale: |
  Production contract gating (verify:http-contracts on prepush) + SemVer 2.0
  카탈로그 버전(HTTP_CONTRACT_CATALOG_VERSION) + 결정적 sha256 fingerprint
  (HTTP_CONTRACT_CATALOG_FINGERPRINT). Property-based regression
  (fast-check, numRuns=100)으로 (method,url)·operationId 유일성, HTTP method
  enum 준수, 2xx/error status 커버리지를 임의 subset에서 검증.
  Fingerprint mismatch 시 breaking-change로 표면화 → 검토·버전 bump 강제.

status: active
since: 2025-09
last_reviewed: 2026-05-21
owner: core

surfaces:
  - "Internal (route registration SSoT)"

key_files:
  - src/interface/http/routes/http-route-contract-catalog.ts
  - src/interface/http/routes/register-contract-route.ts

tests:
