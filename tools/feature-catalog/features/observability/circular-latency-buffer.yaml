id: observability.circular-latency-buffer
name: Circular Latency Buffer
category: observability
summary: |
  in-memory ring buffer로 최근 N건 latency 보관. p50/p95/p99 계산용. 메모리 bound +
  recent-window 분석. tracer/gen-ai-tracing과 별개의 lightweight 측정 path.

maturity: 5
maturity_rationale: |
  Ring buffer + nearest-rank order-statistic percentile(p50/p95/p99)을
  property-based(fast-check, numRuns:100)로 invariant lock:
  capacity bound, percentile monotonicity(p50≤p95≤p99), [min,max] bound,
  single-sample, ring overwrite(recent-window 보존), empty-default(0, no NaN),
  determinism. Named const(LATENCY_PERCENTILE_P50/95/99, EMPTY_PERCENTILE_DEFAULT)
  추출 + slice-evaluator percentile convention과 정렬. known-distribution
  correctness([1..100]→p50=50/p95=95/p99=99), 음수/0 latency 처리 검증.
  multi-process aggregation 부재는 단일 노드 측정 path로서 의도된 scope.

