id: observability.pipeline-debug-steps
name: Pipeline Debug Step Enum (SSoT)
category: observability
summary: |
  파이프라인 step 이름의 canonical enum (search-tokenize, query-inject, vespa-search,
  ranking-rerank, llm-call 등). pipelineTrace() 호출이 이 enum만 emit하도록 강제 →
  debug 로그 일관성 + queryable. SSoT 정책에 따라 모든 step 이름 단일 출처.

