id: observability.silent-skip-counters
name: Silent Skip Counters
category: observability
summary: |
  Silent skip (schema corruption으로 dropped hit, low-confidence ranking suppress 등)을
  reason enum (schema_fail / low_confidence / ...)별 카운트. request 단위 emit + 시계열
  bucket aggregation (per-reason ring of fixed-width time buckets) + 구조적 threshold
  alert hook까지 노출.

maturity: 5
maturity_rationale: |
  Request-scoped counter (`createSilentSkipCounter`) 외에 reason-keyed time-bucket
  ring (`createTimeBucketedSilentSkipCounters`)을 추가하여 시계열 집계가 가능해짐.
  Injectable clock으로 결정론적 테스트, `checkThreshold(kind, threshold)`로 구조적
  alert 판정 (transport는 caller가 wire). time-series ring buffer의 보편 불변식을
  fast-check property 기반 (numRuns:100)으로 검증: ring count bounded, rollover
  off-by-one 없음 (정확 만료), reason isolation (cross-contamination 없음),
  threshold strict-`>`, count 비음수·current ≤ window, same-bucket monotone (정확 N),
  clock determinism. injectable clock으로 실타이머 없이 결정론적. example-based
  Wave 1 suite + property-based suite로 시계열 집계가 SOTA++ 수준으로 잠김.

status: active
