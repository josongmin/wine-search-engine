known_limitations:
  - "일부 silent path 미추적"
  - "Threshold verdict는 구조적 (tripped/observed/threshold) — 실제 alert transport
     (Prometheus/Slack/PagerDuty) wiring은 아직 caller 책임"
  - "Percentile 계산 (p95/p99)은 아직 미지원 — 현재는 window 내 총합 기반"

