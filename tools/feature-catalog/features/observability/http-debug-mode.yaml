related_rfcs: []

known_limitations:
  - "W3C Trace Context propagation 없음 (traceparent/tracestate 헤더 emit/parse 안 함 → cross-service span linking 불가능)"
  - "Outbound 호출(LLM/Vespa/Redis)에 trace 헤더 주입 없음 — process 경계를 넘는 trace 연결 불가"
  - "Cross-request session debugging 없음 (multi-turn agent 분석 어려움)"

next_steps:
  - "W3C Trace Context emission (traceparent on outbound to LLM/Vespa/Redis) — observability.opentelemetry-tracing와 통합 후 가능"
  - "Inbound traceparent parsing + OTel SDK W3C TC propagator 통합"
  - "Session-level debug context (multi-turn agent)"

