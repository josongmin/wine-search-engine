id: observability.retrieval-degradation-metrics
name: Retrieval Degradation Metrics
category: observability
summary: |
  Retrieval 단계 degradation 추적: candidate pool 축소 / channel 누락 / 0-result /
  silent skip 등을 reason별 카운트. GET /metrics/retrieval-degradation으로 노출 (X-Debug-Key
  gated).

maturity: 4
maturity_rationale: |
  Counter 인프라 + /metrics 엔드포인트 + 시계열 집계 (`pool_shrink`,
  `channel_omit`, `zero_result`, `silent_skip` 4-reason ring buffer with
  injectable clock) + 구조적 threshold-check 훅 (alerting transport에 위임, 모듈
  자체는 side-effect 없음). Prometheus-friendly 스냅샷 export
  (`{reason, count_60s, count_300s}`) 추가. 14-case 전용 regression suite
  (boundary slot, strict `>` threshold, unknown-reason graceful, partial
  roll-over, multi-reason isolation, legacy backward-compat) 통과.
  Silent-skip-counters 시계열 패턴과 1:1 미러링.

status: active
since: 2025-11
last_reviewed: 2026-05-21
owner: core

surfaces:
  - "HTTP: GET /metrics/retrieval-degradation"
  - "Programmatic: getRetrievalDegradationTimeSeries() (reason-keyed ring + checkThreshold + exportSnapshot)"

key_files:
  - src/infrastructure/observability/retrieval-degradation-metrics.ts

tests:
  regression:
    - test/regression/retrieval-degradation-metrics-time-series.regression.test.ts

depends_on:
  - observability.silent-skip-counters

related_rfcs: []

known_limitations:
  - "Alert transport (Slack / PD / metrics push) 미배선 — checkThreshold verdict는 구조적으로만 노출"
  - "Production code 경로에서 time-series counter로 mirror-increment 배선 필요 (현재 collector-only)"

next_steps:
  - "Alert transport adapter 배선"
  - "Hybrid retrieval pipeline에서 time-series mirror-increment 호출 배치"
  - "Prometheus exposition format 호환 어댑터"

tags:
  - observability
  - retrieval
  - debug
