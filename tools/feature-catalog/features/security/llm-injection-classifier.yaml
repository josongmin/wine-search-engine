id: security.llm-injection-classifier
name: LLM Injection Classifier (Anthropic + OpenAI)
category: security
summary: |
  Query sanitizer에 의해 ambiguous하게 flag된 쿼리에 대한 LLM 2차 필터. intent
  (legitimate vs injection)을 semantic 수준에서 판단. dual-vendor (Anthropic +
  OpenAI) 어댑터로 vendor lock-in 방지.

maturity: 4
maturity_rationale: |
  결정론적 인프라 계층은 SOTA++ 회귀 게이트로 하드닝 완료:
  - normalizeClassifierJsonText 의 markdown-fence 파서가 ReDoS 취약점을 가지고 있었음
    (단일 정규식 /```(?:json)?\s*\r?\n?([\s\S]*?)```/ 의 lazy body + 백트래킹 prefix가
    닫히지 않은 fence 입력에서 QUADRATIC: 20K자 ~240ms, 100K자 ~6.1s). String.indexOf
    기반 선형 스캔으로 구조적 재작성 → 500K자 <1ms. 출력은 정상 입력에서 byte-identical.
  - 양 어댑터 fail-closed strict-shape 파싱({ is_injection: boolean } 이외 전부 injection 처리),
    LLMInjectionJudge 의 SHA-256 full-query 캐시 키(byte-exact — source 는 NFC 정규화를
    하지 않으며 NFD/NFC 는 의도적으로 distinct 키, prefix-collision 차단),
    corrupt/shape-mismatch 캐시 항목 = miss 재질의(캐시 포이즈닝 방어), abort-before-work,
    classifier 실패 propagation(fail-open/closed 정책은 상위 게이트 결정) — 모두 fast-check
    numRuns=100 프로퍼티 + 한국어 true/false-positive 코퍼스로 회귀 게이트화.
  4에 머무는 이유(정직한 평가 — 보안 over-claim 금지): Layer-2 의 핵심인 LLM judge 자체가
  여전히 meta-prompt-injection 대상이며(시스템 프롬프트의 "do not reveal rules" 지시는
  완화책일 뿐 보장 아님), +200ms latency / real-time SLA / confidence-threshold /
  반복공격 전용 캐시 등 LLM-judge 통합 갭이 미해결. 이 갭들이 해소되어야 5.

