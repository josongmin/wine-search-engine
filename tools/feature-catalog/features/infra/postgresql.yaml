id: infra.postgresql
name: PostgreSQL Client & Repositories
category: infra
summary: |
  pg.Pool 기반 connection pool (default 10), entity/alias/watchlist repository, Flyway
  마이그레이션, health check + circuit breaker. snapshot resolver (active 버전 추적)
  포함.

maturity: 5
maturity_rationale: |
  SOTA++ production-grade. pool 튜닝이 named const (PG_POOL_MAX_CONNECTIONS_DEFAULT,
  PG_POOL_IDLE_TIMEOUT_MS_DEFAULT, PG_POOL_CONNECTION_TIMEOUT_MS_DEFAULT)로 SSoT
  공개되어 테스트/ops 스크립트와 정합. property-based regression (fast-check
  numRuns=100) 6개로 pgBouncer-style invariant 검증: pool size bound,
  idle-acquire 동기성, release→idle 회복, connection-timeout 발화, Korean error
  preservation, 트랜잭션 rollback. migration 안정, 데이터 corruption 사고 없음,
  type-safe query builder 제공. 남은 한계는 query 결과 cache 부재뿐 (별도 캐시
  레이어에서 처리).

status: active
since: 2025-08
last_reviewed: 2026-05-21
owner: core

surfaces:
  - "Internal (모든 stateful 도메인 데이터 액세스)"

key_files:
  - src/infrastructure/db/pg-pool.ts
  - src/infrastructure/db/active-snapshot-resolver.ts
  - src/infrastructure/db/migrate.ts

tests:
  regression:
    - test/regression/pg-pool-properties.regression.test.ts

depends_on: []

related_rfcs: []

known_limitations:
  - "Query 결과 cache 없음"
  - "Warm-up query 필요"

next_steps:
  - "Prepared statement caching"
  - "Query 결과 cache"

tags:
