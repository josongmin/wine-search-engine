id: infra.vespa-cloud
name: Vespa Cloud HTTP Client
category: infra
summary: |
  Vespa search / document API 저수준 HTTP client. native undici fetch, Cloud용 mTLS,
  channel별 timeout (search 30s / doc 15s / get 10s), retry + response Zod schema 검증.

maturity: 5
maturity_rationale: |
  장기 안정 운영, minimal churn. comprehensive error recovery + channel-별 timeout +
  schema validation으로 malformed hit 캐치. 주간 100K+ query에 network 에러 <0.01%.
  Vespa Cloud (p0-lab.wine-searcher / dev-aws-us-east-1c)에 wired.

