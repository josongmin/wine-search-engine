id: infra.reranker
name: Cohere Reranker (+ Cached Wrapper)
category: infra
summary: |
  Cohere rerank API 어댑터 + cached-reranker로 동일 query/doc 조합 cache. retrieval
  candidate pool 위 후처리 reranking 후보 (현재 hybrid score blend만 사용 중).

maturity: 4
maturity_rationale: |
  Production DI-wired in `container-adapters.ts:217` —
  `new CachedReranker({ modelId: config.cohere.rerankModel, inner: new CohereReranker({...}) })`.
  RerankerPort + Cohere HTTP adapter + per-query-doc cache (in-memory LRU or
  Redis). 2026-05-21 SOTA++ pass:
  - Replaced bare `sort((a,b) => b.score - a.score)` with SSoT
    `compareScoreWithTiebreaker` (entityId-ascending tie-break) — eliminates
    input-order leakage on equal Cohere relevance_scores. This was a real
    determinism bug surfaced by fast-check counterexample
    (candidates `_0a`, `-0-` flipped order across input permutations).
  - Added 9 fast-check property tests (numRuns=100 ⇒ 900 randomized cases
    per CI run) covering: permutation, dense 1-based rank, score
    monotonicity, deterministic tie-break across input permutations,
    NaN/Infinity rejection, out-of-[0,1] rejection, empty/non-positive
    limit guards, cache memoization (byte-identical hit/miss), cache key
    disjoint on limit. See test/regression/reranker-properties.regression.test.ts.
  - Reused SSoT comparator from `@shared/utils/stable-comparator.ts` —
    no private duplicate.
  Still blocking 5: production A/B + cost dashboard + p95 latency SLA + cost
  regression gate. The reranker is wired but its A/B lift on retrieval
  quality is not yet measured against the baseline blend.

status: active
