id: infra.reranker
name: Cohere Reranker (+ Cached Wrapper)
category: infra
summary: |
  Cohere rerank API 어댑터 + cached-reranker로 동일 query/doc 조합 cache. retrieval
  candidate pool 위 후처리 reranking 후보 (현재 hybrid score blend만 사용 중).

maturity: 3
maturity_rationale: |
  Production DI-wired in `container-adapters.ts:217` —
  `new CachedReranker({ modelId: config.cohere.rerankModel, inner: new CohereReranker({...}) })`.
  RerankerPort 구현, Cohere rerank API + per-query-doc cache. 그러나 production
  retrieval pipeline에서 활성화되는 시점 / A/B 게이트 미수립, cost/latency budget
  데이터 부재. 4가 되려면 production A/B + cost dashboard + 회귀 게이트 필요.

status: active
