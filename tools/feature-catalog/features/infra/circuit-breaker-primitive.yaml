id: infra.circuit-breaker-primitive
name: Circuit Breaker Primitive
category: infra
summary: |
  Domain shared/circuit-breaker — open/closed/half-open 상태 + threshold + cooldown.
  observability.circuit-breaker-registry가 이 primitive를 등록 관리.

maturity: 5
maturity_rationale: |
  Netflix Hystrix-style three-state machine (CLOSED/OPEN/HALF_OPEN) with named
  defaults (DEFAULT_FAILURE_THRESHOLD / DEFAULT_RECOVERY_TIMEOUT_MS /
  DEFAULT_HALF_OPEN_ATTEMPTS), wired into observability registry and consumed
  by multiple infra adapters. Backed by industry-verified state-machine
  property tests (fast-check, numRuns=100) covering CLOSED→OPEN threshold,
  success-reset, off-by-one boundary, OPEN→HALF_OPEN cooldown with injectable
  clock (vi.useFakeTimers), HALF_OPEN→CLOSED on probe success,
  HALF_OPEN→OPEN with cooldown reset on probe failure, counter monotonicity,
  deterministic-clock invariance, and force-open/force-close admin paths.
  State persistence는 없음 (in-memory only).

status: active
since: 2025-09
last_reviewed: 2026-05-21
owner: core

surfaces:
  - "Internal"

key_files:
  - src/domain/shared/circuit-breaker

tests:
