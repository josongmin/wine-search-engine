depends_on: []

related_rfcs: []

known_limitations:
  - "Unicode 정규화는 호출자 책임 — NFC '가' (U+AC00) 와 NFD '가' (U+1100 U+1161) 은 서로 다른 canonical form 으로 직렬화됨. 동등성 필요 시 호출자가 .normalize('NFC') 적용."

