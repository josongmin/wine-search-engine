id: infra.redis
name: Redis Cache Client + Circuit Breaker
category: infra
summary: |
  redis npm 패키지 기반 client (getRedisClient async). cache miss를 graceful하게
  primary source로 fallback. key pattern delete 지원. circuit breaker wrapper로
  Redis 장애 cascade 방지.

  **Official runtime stack status (2026-06): EXCLUDED.** Deploy env must leave
  `REDIS_URL` unset until `retrieval.cache-policy` is re-approved and
  `infra.redis-cache-layer` TTL/eviction policy is signed off. Code remains for
  CI lanes and future re-enable.

maturity: 4
maturity_rationale: |
  Client + circuit breaker are production-grade and well-tested, but Redis is
  temporarily removed from the official deploy surface while cache policy is
  redesigned. Maturity lowered from 5 → 4: implementation is sound, operational
  contract is frozen pending policy work.

status: deprecated
since: 2025-08
last_reviewed: 2026-06-10
owner: core

surfaces:
  - "Internal (cache layer — disabled in official deploy)"

key_files:
  - src/infrastructure/db/redis-client.ts
  - src/infrastructure/db/redis-circuit-breaker-wrapper.ts
  - src/infrastructure/db/redis-delete-by-pattern.ts

tests:
  unit:
    - src/infrastructure/db/__tests__/redis-client.circuit-breaker.test.ts
  regression:
    - test/regression/redis-client-properties.regression.test.ts

depends_on:
  - observability.circuit-breaker-registry

related_rfcs: []

known_limitations:
  - "OFFICIAL STACK EXCLUDED (prod/dev/CI) — do not set REDIS_URL until cache policy re-approval"
  - "TTL 관리 정형화 없음"
  - "Redis Cluster 미지원"

next_steps:
  - "Finalize retrieval.cache-policy (eligibility, TTL, invalidation)"
  - "Re-enable Redis in official stack after infra.redis-cache-layer sign-off"
  - "Redis Cluster"

tags:
  - infrastructure
  - caching
  - resilience
