id: infra.redis-cache-layer
name: Redis Cache Layer (Embedding / Phrase / Query)
category: infra
summary: |
  Redis 기반 3-축 cache: embedding cache (OpenAI vector 재호출 방지), phrase cache
  (alias/transliteration), query cache (search result).

  **Official runtime stack status (2026-06): EXCLUDED** together with
  `infra.redis`. Production/dev deploy uses in-process fallback only until cache
  policy is re-approved.

maturity: 3
maturity_rationale: |
  Implementation exists and is tested, but the layer is not wired in official
  deploy env (`REDIS_URL` unset, `KILL_SWITCH_QUERY_CACHE=true` recommended).
  Maturity reduced pending cache-policy redesign and operational sign-off.

status: deprecated
since: 2025-09
last_reviewed: 2026-06-10
owner: core

surfaces:
  - "Internal (disabled in official deploy)"

key_files:
  - src/infrastructure/cache/cache-ttl-config.ts
  - src/infrastructure/cache/redis-embedding-cache.ts
  - src/infrastructure/cache/redis-phrase-cache.ts
  - src/infrastructure/cache/redis-query-cache.ts

tests:
  regression:
    - test/regression/redis-cache-ttl-formalization.regression.test.ts
    - test/regression/redis-cache-layer-properties.regression.test.ts
  unit:
    - src/infrastructure/cache/__tests__/redis-phrase-cache.test.ts

depends_on:
  - infra.redis

related_rfcs: []

known_limitations:
  - "OFFICIAL STACK EXCLUDED (prod/dev/CI) — Redis cache layer must not be enabled until policy sign-off"
  - "LFU / 가중치 eviction 없음 (Redis LRU only)"
  - "TTL은 정적 default — adaptive TTL (popularity-based) 미도입"

next_steps:
  - "Blocker: retrieval.cache-policy redesign + invalidation contract"
  - "Re-enable after infra.redis official-stack approval"
  - "Prometheus exporter로 sets/hits/misses 카운터 노출"

tags:
  - caching
  - redis
  - performance
