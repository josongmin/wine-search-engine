id: infra.redis-cache-layer
name: Redis Cache Layer (Embedding / Phrase / Query)
category: infra
summary: |
  Redis 기반 3-축 cache: embedding cache (OpenAI vector 재호출 방지), phrase cache
  (alias/transliteration), query cache (search result). 70% hit rate on repeated query.

maturity: 4
maturity_rationale: |
  3 cache 모두 production wired, circuit breaker 통합. TTL 정책이 `cache-ttl-config.ts`
  SSoT 모듈로 정형화됨 (EMBEDDING 7d / PHRASE 1d / QUERY 5min, 각 값에 도메인 근거 주석).
  Telemetry hook으로 `getStats()` surface가 `{hits, misses, sets}` 확장 — 운영자가
  write-amplification과 hit-rate를 독립적으로 모니터링 가능. eviction strategy는
  여전히 Redis LRU만.

status: active
since: 2025-09
last_reviewed: 2026-05-21
owner: core

surfaces:
  - "Internal"

key_files:
  - src/infrastructure/cache/cache-ttl-config.ts
  - src/infrastructure/cache/redis-embedding-cache.ts
  - src/infrastructure/cache/redis-phrase-cache.ts
  - src/infrastructure/cache/redis-query-cache.ts

tests:
  regression:
    - test/regression/redis-cache-ttl-formalization.regression.test.ts
  unit:
    - src/infrastructure/cache/__tests__/redis-phrase-cache.test.ts

depends_on:
  - infra.redis

related_rfcs: []

known_limitations:
  - "LFU / 가중치 eviction 없음 (Redis LRU only)"
  - "TTL은 정적 default — adaptive TTL (popularity-based) 미도입"

next_steps:
  - "LFU eviction 도입"
  - "Adaptive TTL: popular key는 자동 연장"
  - "Prometheus exporter로 sets/hits/misses 카운터 노출"

tags:
  - caching
  - redis
  - performance
