id: infra.di-composition-root
name: DI Composition Root (Container)
category: infra
summary: |
  애플리케이션의 dependency injection composition root. container.ts + sub-container
  모듈(core / adapters / aux-features / eval-contracts / features / lookup-authority /
  runtime-support / search-contracts / stubs / structured-llm / usecases). 모든 use case
  + adapter 와이어링.

maturity: 5
maturity_rationale: |
  체계적으로 분할된 sub-container, 신규 wiring 추가 패턴 명확. 선언적
  wiring manifest (`src/config/container-wiring-manifest.ts`)가 sub-container DAG의
  SSoT 역할을 수행, Kahn topological sort 기반 cycle 검출 + production port 열거 +
  factory test-override hook + 에러 메시지 NFC 보존을 단일 regression 스위트
  (`test/regression/di-composition-root.regression.test.ts`, 13 tests)에서 강제.

status: active
since: 2025-09
last_reviewed: 2026-06-10
owner: core

surfaces:
  - "Internal (bootstrap)"

key_files:
  - src/config/container.ts
  - src/config/container-core.ts
  - src/config/container-adapters.ts
  - src/config/container-aux-features.ts
  - src/config/container-features.ts
  - src/config/container-usecases.ts
  - src/config/container-search-contracts.ts
  - src/config/container-eval-contracts.ts
  - src/config/container-lookup.ts
  - src/config/container-structured-llm.ts
  - src/config/container-runtime-support.ts
  - src/config/lookup-authority.ts
  - src/config/container-stubs.ts
  - src/config/container-core-builders.ts
  - src/config/container-wiring-manifest.ts
  - src/main.ts

tests:
  unit:
    - src/config/__tests__/container-usecases.test.ts
    - src/config/__tests__/lookup-authority.test.ts
  regression:
    - test/regression/di-composition-root.regression.test.ts

depends_on: []

related_rfcs: []

known_limitations:
  - "Container 빌드 latency 측정 안 됨"

next_steps:
  - "Container 빌드 latency telemetry"
  - "Manifest port enumeration → Container type generation으로 한쪽 SSoT 통합"

tags:
