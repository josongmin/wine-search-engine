id: infra.fixture-loader
name: Fixture Loader & Suite Registry
category: infra
summary: |
  Eval / regression / replay fixture를 디렉터리 단위로 로드하고 suite로 등록.
  fixture 파일 발견 + Zod 검증 + suite 메타데이터.

maturity: 5
maturity_rationale: |
  SOTA++ external-data boundary. 모든 외부 fixture 경계에 다음 산업 표준 패턴 적용:

  - **Schema enforcement**: Zod `.strict()` + JSON Schema `additionalProperties: false`
    이중 게이트. case ↔ suite prefix cross-validation은 `superRefine`으로 강제.
  - **Determinism**: 같은 바이트 → deeply-equal 객체 (fast-check 100-run property test).
  - **Path safety**: `assertSafePath`가 절대 경로 강제 + traversal 차단
    (fast-check 100-run으로 `../` 깊이 1-10 임의 조합 검증).
  - **Encoding stability (NEW)**: UTF-8 BOM 자동 stripping (RFC 8259 §8.1) + Korean
    NFC 재정규화 (W3C i18n WG "Early Uniform Normalization"). macOS HFS+ NFD 입력
    이 silently `===` mismatch 일으키던 버그 구조적으로 차단.
  - **DoS guard (NEW)**: per-file 4 MB cap (`MAX_FIXTURE_JSON_BYTES`) — 대용량 blob이
    JSON.parse heap 폭증 일으키기 전에 typed Error.
  - **Schema versioning**: `FIXTURE_SCHEMA_VERSION` + `FIXTURE_SCHEMA_VERSIONS` allowlist
    (Snowplow Iglu / OpenAPI 패턴). default 적용 + unknown version reject.
  - **Property tests**: 17 tests / 8 invariant groups / fast-check `numRuns=100`
    (I/O lane 30) — append-only regression `test/regression/fixture-loader-properties.regression.test.ts`.

status: active
since: 2025-10
last_reviewed: 2026-05-21
owner: core

surfaces:
