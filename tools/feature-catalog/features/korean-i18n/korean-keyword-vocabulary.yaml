id: korean-i18n.korean-keyword-vocabulary
name: Korean Wine Keyword Vocabulary & NL Mapper
category: korean-i18n
summary: |
  와인 도메인 한국어 키워드 사전 (단맛/바디/타닌 표현, 음용 의도 표현, 페어링
  marker). nl-mapper에서 attribute 매핑, agent tools에서 intent 라우팅, query
  normalizer에서 정규화 신호로 사용. SSoT는 `DEFAULT_MAPPINGS` (nl-mapper.ts)
  + `CURATED_ENTITY_ALIAS_CATALOG`, fast-check 기반 property-regression으로
  invariants가 잠겨 있음.

maturity: 5
maturity_rationale: |
  SOTA++ 한국어 키워드 vocabulary SSoT — 검증 가능한 invariants 9종이
  fast-check (numRuns=100) property-regression으로 락업되어 있음.
  V1 set-integrity (unique keys, lowercase-trim invariant), V2 NFC stability
  (lookup key + phrase 필드 모두 normalize('NFC') 동치), V3 whitespace
  discipline (edge/double space 금지), V4 phrase↔key coherence,
  V5 operator/value coherence (range tuple, '=' string|number, '<='/'>='
  finite number, confidence ∈ [0,1]), V6 catalog-internal substring-collision
  audit (Korean key가 다른 catalog key의 strict Hangul-embedded substring일
  때 다른 semantic이면 fail), V6b multi-token Korean phrase 분해 sanity,
  V6c external corpus collision sweep (real Korean wine-domain query
  corpus 109건), V7 NLMapper.mapPhrase round-trip (전체 catalog),
  V8 deterministic iteration (sorted snapshot), V9 fuzz (한글+accented Latin
  +emoji+ASCII never throws + toNormalizedConstraint round-trip).
  V6 audit가 실제 catalog 버그(`'싼'`이 `'비싼'`의 strict Hangul-embedded
  substring인데 OPPOSITE semantic — budget vs luxury)를 적발하여
  구조적으로 제거. 모든 invariants가 future regression 게이트로 동작.

status: active
