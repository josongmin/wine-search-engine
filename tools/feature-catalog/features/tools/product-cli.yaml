id: tools.product-cli
name: Product CLI (wine command)
category: tools
summary: |
  Universal `wine <group> <command>` operator CLI: a thin shell over
  application/container ports. A shared kernel (registry, global args, command
  context, exit-code contract) drives auth, typed product commands
  (search/entity/wine-search), and a raw `api call` surface. Each command runs
  against a `local` target (in-process createContainer ports) or `remote`
  (HTTP routes) behind one facade contract, so the surface and `--json` output
  are target-independent.

maturity: 4
maturity_rationale: |
  Kernel + auth/profile plane + typed facades (local+remote) + raw api + bin
  packaging are wired and covered by 24 unit files / 171 cases: a local↔remote
  parity gate, a deterministic smoke proof rail, a renderer matrix, and
  facade/command/arg-utils tests. typecheck/build/lint green. The `local` target
  is now live-verified against real infra (2026-05-29): `search run --target
  local "opus one 2018"` resolved end-to-end via RDS (exit 0, single_entity),
  and `search hybrid --target local` returned 20 results via the Vespa retrieval
  channel (sg temporarily opened to the runner IP, then reverted). Not 5 because
  `wine-search` (PtE/Anthropic) and remote-target live calls are not yet part of
  an automated live smoke, and shell completion is deferred.

status: active
since: 2026-05
last_reviewed: 2026-05-29
owner: core

surfaces:
  - "CLI: wine auth status|path|refresh|doctor|login|whoami"
  - "CLI: wine search run|hybrid / wine entity resolve|autocomplete / wine wine-search run"
  - "CLI: wine api call|openapi (--target local|remote, --output json|table|yaml|raw)"

key_files:
  - src/interface/cli/main.ts
  - src/interface/cli/run-cli.ts
  - src/interface/cli/command-registry.ts
  - src/interface/cli/render/render-command-result.ts
  - src/config/cli-container.ts
  - src/application/cli/command/cli-command.ts
  - src/infrastructure/cli/auth/codex-auth-facade.ts
  - src/infrastructure/cli/local/local-search-facade.ts
  - src/infrastructure/cli/remote/remote-http-client.ts

tests:
  unit:
    - src/interface/cli/__tests__/run-cli.test.ts
    - src/interface/cli/__tests__/cli-smoke-rail.test.ts
    - src/interface/cli/render/__tests__/render-command-result.test.ts
    - src/infrastructure/cli/__tests__/local-remote-parity.test.ts
    - src/infrastructure/cli/auth/__tests__/codex-auth-facade.test.ts
    - src/infrastructure/cli/remote/__tests__/remote-http-client.test.ts
    - src/application/cli/command/__tests__/api-call-command.test.ts
  e2e:
    - test/e2e/cli-process.test.ts

depends_on: []

related_rfcs:
  - docs/plans/may-28-cli/rfc.md
  - docs/plans/may-28-cli/architecture-decision.md

known_limitations:
  - "Live verification of the `local` target was a manual one-off (RDS entity-lookup + Vespa hybrid on 2026-05-29); there is no automated live/CI smoke yet — unit coverage uses fakes."
  - "`wine-search` (PtE/Anthropic) and remote-target HTTP calls have not been exercised live."
  - "`api call` is remote-only; on the local target it returns a usage error (exit 2). Local raw HTTP is intentionally unsupported."
  - "Shell completion is not supported in v1 (explicit deferral, no parser swap)."
  - "Local search/hybrid facade reuses deepKeysToSnake from the HTTP layer for wire parity — an intentional one-way infra->interface import edge."

next_steps:
  - "A gated black-box e2e exists (test/e2e/cli-process.test.ts: offline matrix always-on + WINE_CLI_LIVE_E2E=1 live `search run`). Next: wire the live block into a scheduled CI lane and extend it to Vespa hybrid + a remote-target `api call`."
  - "Evaluate shell-completion support as a follow-up ticket."

tags:
