id: tools.product-cli
name: Product CLI (wine command)
category: tools
summary: |
  Universal `wine <group> <command>` operator CLI: a thin shell over
  application/container ports. A shared kernel (registry, global args, command
  context, exit-code contract) drives auth, typed product commands
  (search/entity/wine-search), and a raw `api call` surface. Each command runs
  against a `local` target (in-process createContainer ports) or `remote`
  (HTTP routes) behind one facade contract, so the surface and `--json` output
  are target-independent.

maturity: 3
maturity_rationale: |
  Kernel + auth/profile plane + typed facades (local+remote) + raw api + bin
  packaging are wired and covered by 24 unit files / 171 cases: a local↔remote
  parity gate, a deterministic smoke proof rail, a renderer matrix, and
  facade/command/arg-utils tests. typecheck/build/lint green. Held at 3 (not 4)
  because the `local` target has only been proven with fake-port/fake-fetch
  units — never executed against live PG/Redis/Vespa — and shell completion is
  deferred.

status: active
since: 2026-05
last_reviewed: 2026-05-29
owner: core

surfaces:
  - "CLI: wine auth status|path|refresh|doctor|login|whoami"
  - "CLI: wine search run|hybrid / wine entity resolve|autocomplete / wine wine-search run"
  - "CLI: wine api call|openapi (--target local|remote, --output json|table|yaml|raw)"

key_files:
  - src/interface/cli/main.ts
  - src/interface/cli/run-cli.ts
  - src/interface/cli/command-registry.ts
  - src/interface/cli/render/render-command-result.ts
  - src/config/cli-container.ts
  - src/application/cli/command/cli-command.ts
  - src/infrastructure/cli/auth/codex-auth-facade.ts
  - src/infrastructure/cli/local/local-search-facade.ts
  - src/infrastructure/cli/remote/remote-http-client.ts

tests:
