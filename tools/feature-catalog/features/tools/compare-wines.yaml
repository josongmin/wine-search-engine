id: tools.compare-wines
name: compare_wines Agent Tool
category: tools
summary: |
  두 wine 비교용 agent tool. query_a/query_b + side-specific constraint
  (country/region/appellation/grape/vintage/wine_type per side). Parallel
  dual-leg retrieval → side별 결과 with ranking.

maturity: 3
maturity_rationale: |
  agent-tools.ts CompareInputSchema + compare-retriever 와이어링 완료. parallel
  execution regression 게이트. 그러나 비교 전용 ranking / cross-side balance /
  contrast scoring 부재로 단순 2x search 수준에 머무름.

status: active
