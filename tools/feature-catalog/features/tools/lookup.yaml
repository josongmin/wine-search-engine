id: tools.lookup
name: Lookup Endpoint (Direct Entity Fetch)
category: tools
summary: |
  POST /v2/entity-lookup — entity-only 전용 해소 surface. detail page,
  evidence 확장, agent grounding 용. generic search wrapper가 아니라 dedicated
  lookup authority를 직접 탄다.

maturity: 3
maturity_rationale: |
  HTTP route 와이어링 + entity-lookup-v2 regression suite 완료
  (`test/integration/http/routes/entity-lookup-v2.route.test.ts`).
  핵심 invariants 명세 + 검증:
    - retrieval_mode 강제 'entity' (override 차단)
    - "not found" semantics: 404 가 아닌 200 + empty results + failure_reason
      (multi-vintage variant 응답 명세를 단일 entity 경로로 통일)
    - Korean alias query (NFC) 통과, NFC/NFD form-preserving
      (route 단에서 collapse 하지 않고 entity-identity layer 로 위임)
    - missing/empty/oversized query → 400 + RFC-014 VALIDATION_ERROR envelope
    - MAX_QUERY_LENGTH 경계값 (just-inside / just-outside)
    - comparison response leak → 400 INVALID_REQUEST envelope
    - requestId thread-through (use case ↔ meta)
    - special chars 보존, AbortSignal 전파
  잔여: cross-language entity_id alias 풀 확장은 retrieval.entity-lookup 책임.

status: deprecated
since: 2025-10
last_reviewed: 2026-06-10
owner: core

surfaces:
  - "HTTP: POST /v2/entity-lookup"

key_files:
  - src/interface/http/routes/entity-lookup-v2.route.ts
  - src/interface/http/schemas/entity-lookup-v2.schema.ts
  - src/config/lookup-authority.ts

tests:
  integration:
    - test/integration/http/routes/entity-lookup-v2.route.test.ts

depends_on:
  - retrieval.entity-lookup

related_rfcs: []

known_limitations:
  - "이 항목은 legacy catalog id 유지용이다. live lookup authority 설명은 `retrieval.entity-lookup-v2`가 SSOT다."
  - "Cross-language entity_id alias 풀 확장 미흡 (retrieval.entity-lookup 영역)"

next_steps:
  - "feature catalog consumer가 `retrieval.entity-lookup-v2`로 완전히 이관되면 이 항목 삭제"

tags:
  - lookup
  - detail-fetch
