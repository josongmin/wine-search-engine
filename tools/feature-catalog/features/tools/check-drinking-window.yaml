id: tools.check-drinking-window
name: check_drinking_window Agent Tool
category: tools
summary: |
  특정 wine 엔티티의 최적 음용 시기 추정 tool. canonical entity_id + optional
  target year 입력. drinking-window.usecase로 deterministic + ML predictor 호출,
  structured begin/end + 신뢰도 반환.

maturity: 3
maturity_rationale: |
  agent-tools.ts DrinkingWindowInputSchema + drinking-window.usecase 와이어링.
  Predictor 단위 테스트 + regression 게이트. target_year 파라미터는 정의되었으나
  실제 활용 미흡. confidence bound 부재.

status: active
since: 2025-09
last_reviewed: 2026-05-21
