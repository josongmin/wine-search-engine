id: tools.feedback
name: Feedback Endpoint
category: tools
summary: |
  POST /v1/feedback — 사용자 클릭/평가/abandonment 시그널 ingest. position debias + TTL
  enforce 후 learning loop 입력.

maturity: 3
maturity_rationale: |
  HTTP route + feedback 도메인 + ingestion 파이프라인 작동.
  HTTP route 레벨 regression suite (19 tests + 1 todo) 가 click/purchase positive
  + dismiss negative happy-path, RFC-014 VALIDATION_ERROR envelope (missing
  entity_id / session_id / invalid signal_type / empty + oversized query +
  entity_id / strict-mode unknown key), Korean NFC verbatim 전달, NFC vs NFD
  보존, X-Request-Id propagation, Idempotency-Key (UUID-shaped honored / non-UUID
  rejected), kill-switch + null FeedbackStore 둘 다 503 FEEDBACK_UNAVAILABLE,
  ingestion failure → fabricated 201 금지 + 500 envelope 를 커버. Production LTR
  retraining cadence 연결과 route-level rate-limit/bot detection (현재 todo) 는
  여전히 미수립 — maturity 4 가 되려면 그 작업이 선결조건.

status: active
since: 2025-11
last_reviewed: 2026-05-21
owner: core

