id: tools.replay
name: Replay Fixture Runner
category: tools
summary: |
  과거 쿼리 plan 기반 replay fixture runner. public replay route는 제거되었고,
  현재는 `test/replay-fixtures/` 기반 lane으로 유지된다.

maturity: 3
maturity_rationale: |
  Use case + route + fixture 저장 인프라 (e2e replay test) 완비. 그러나 fixture
  schema versioning 미수립, fixture가 grow하면서 staleness 위험.

status: deprecated
since: 2025-10
last_reviewed: 2026-05-21
owner: core

surfaces:
  - "Replay fixture runner: test/replay-fixtures/search/*"

key_files:
  - test/replay-fixtures/search/run-search-fixture.ts

tests:
  e2e:
    - test/e2e/search-replay-runtime-required-fixtures.test.ts
  unit:
    - test/unit/replay-fixtures/run-search-replay.test.ts

depends_on:
  - retrieval.hybrid-search

related_rfcs: []

known_limitations:
  - "Fixture schema versioning 없음"
  - "Fixture staleness 위험"

next_steps:
  - "Fixture schema version"
  - "Staleness 자동 감지"

tags:
  - debug
  - regression
  - fixtures
