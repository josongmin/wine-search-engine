id: tools.get-food-pairings
name: get_food_pairings Agent Tool
category: tools
summary: |
  음식 → 와인 페어링 추천 tool. 음식 텍스트, cuisine, 식사 종류 + 와인 선호도
  (style, price band, region) 입력. food-pairing-tool-policy로 filter/preference
  구성 후 hybrid retrieval, structured pairing confidence 반환.

maturity: 3
maturity_rationale: |
  agent-tools.ts FoodPairingInputSchema + food-pairing-tool-policy 와이어링이
  goldened 되어 있고, dedicated regression suite가 tool 입력 → 출력 계약
  (영어/한국어 food, color/wine_type filter, max_price_krw clause, multi-constraint
  forwarding, Zod 검증 경계, negation forwarding, 결정성, 특수문자/한글 조사 보존)
  을 잠근다. Pairing extractor Wave 1 negation도 forwarding 경로로 검증됨.
  여전히 부재한 부분(maturity 4로 가기 위한): wine↔food embedding alignment,
  pairing confidence calibration, cuisine-specific weight.

status: active
since: 2025-09
last_reviewed: 2026-05-21
owner: core

surfaces:
  - "Agent tool: get_food_pairings"

key_files:
  - src/application/agent/agent-tools.ts
  - src/application/search/food-pairing-tool-policy.ts
  - src/application/search/search-tool-query-policy.ts

tests:
  regression:
    - test/regression/agent-tools-evidence-frame-emission.regression.test.ts
    - test/regression/get-food-pairings-tool.regression.test.ts

depends_on:
  - retrieval.hybrid-search
  - nlu.pairing-extraction

related_rfcs: []

known_limitations:
  - "Wine↔food embedding alignment 부재 (attribute 기반 soft filter만)"
  - "Pairing confidence uncalibrated"
  - "Cuisine 별 가중치 미적용"

next_steps:
  - "Food↔wine pairing 임베딩 학습"
  - "Critic pairing reference 통합"

tags:
  - agent-tool
  - food-pairing
  - soft-filter
