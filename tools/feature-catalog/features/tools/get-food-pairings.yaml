id: tools.get-food-pairings
name: get_food_pairings Agent Tool
category: tools
summary: |
  음식 → 와인 페어링 추천 tool. 음식 텍스트, cuisine, 식사 종류 + 와인 선호도
  (style, price band, region) 입력. food-pairing-tool-policy로 filter/preference
  구성 후 hybrid retrieval, structured pairing confidence 반환.

maturity: 2
maturity_rationale: |
  agent-tools.ts FoodPairingInputSchema + food-pairing-tool-policy 와이어링 완료.
  Schema validation + 기본 retrieval. 그러나 wine↔food embedding alignment /
  pairing confidence calibration / cuisine-specific weight 부재.

