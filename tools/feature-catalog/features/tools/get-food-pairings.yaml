id: tools.get-food-pairings
name: get_food_pairings Agent Tool
category: tools
summary: |
  음식 → 와인 페어링 추천 tool. 음식 텍스트, cuisine, 식사 종류 + 와인 선호도
  (style, price band, region) 입력. food-pairing-tool-policy로 filter/preference
  구성 후 hybrid retrieval, structured pairing confidence 반환.

maturity: 4
maturity_rationale: |
  HONEST 4. food-pairing-tool-policy 결정론 코어를 fast-check property suite
  (numRuns=100, 9 tests)로 락업: budget resolution (max_price_krw가 max_price보다
  우선·verbatim, USD→KRW 변환이 maxPriceKrwCap에서 capped + integer, non-finite
  USD → undefined no-leak, no-field → undefined, determinism), color clause/filter
  ('both'/undefined → ''·[], concrete color → ` ${color} wine` + 단일 wine_type '='
  constraint w/ confidence 1.0 + version forwarding), structured preferences (typed
  objective가 각자 constraint로 보존 + 올바른 operator: sweetness '=', acidity '>=',
  tannin '<=', pairing 'in'; empty pairing_tags → pairing constraint 없음; Korean
  pairing tag NFC-stable; empty input → []). 기존 tool 입력→출력 계약 regression
  유지 (영/한 food, Zod 경계, negation forwarding). 남은 maturity 5 과제:
  wine↔food embedding alignment, pairing confidence calibration, cuisine-specific
  weight (learning/product gap, policy code 결함 아님).

status: deprecated  # Cutover 3.0.0 (2026-05-23): replaced by wine-search PtE
