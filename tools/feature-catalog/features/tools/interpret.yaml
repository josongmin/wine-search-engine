id: tools.interpret
name: Interpret Query Runner (Query Interpretation Trace)
category: tools
summary: |
  입력 쿼리에 대한 NLU/planner 해석 결과를 생성하는 eval/integration query runner
  (intent, constraints, anchors, decomposition, situational policy 결과 등).

maturity: 3
maturity_rationale: |
  Eval/integration runner + schema contract tests lock InterpretResponseSchema (V1)
  and InterpretResponseV2Schema (Accept: human+json). Coverage: Korean/English/Mixed
  plain query, constraints, pairing intent, comparison decomposition (V2), OOD,
  RFC-014 envelope boundaries, Unicode NFC/NFD forwarding, MAX_QUERY_LENGTH.
  No live HTTP route after V2 cutover — runner-only rail.

status: deprecated
since: 2025-10
last_reviewed: 2026-06-10
owner: core

surfaces:
  - "Eval/integration: buildInterpretQueryRunnerForEval() (no public HTTP route)"

key_files:
  - src/application/search/interpret-query-runner.ts
  - src/config/build-interpret-query-runner.ts
  - src/interface/http/schemas/search-response.schema.ts
  - src/interface/http/schemas/search-response-v2.schema.ts

tests:
  unit:
    - test/unit/application/search/interpret-query-runner.test.ts
    - src/interface/http/schemas/__tests__/interpret-response.schema.test.ts

depends_on:
  - nlu.search-constraint-extraction
  - nlu.anchor-extraction
  - nlu.decomposition-detection
  - agent.semantic-contract-compiler

related_rfcs: []

known_limitations:
  - "Response shape는 InterpretResponseSchema(V1) 로 freeze 되었으나, 신규 planner 필드를 추가하려면 schema-side 변경이 필요"
  - "V1 응답에는 decomposition_hint 가 노출되지 않음 — comparison 디스플레이는 V2 explain 경로(Accept: human+json) 필요"
  - "Versioning은 Accept 헤더(content negotiation) 기반이며 별도 path versioning(/v2/search/interpret)은 별 contract"

next_steps:
  - "V1 deprecation 일정 확정 후 docs/migration/v1-v2-api-migration.md 갱신"
  - "Response field에 mapping_version 등 신규 provenance 필드 노출 시 회귀 테스트 확장"

tags:
  - debug
  - interpretation
