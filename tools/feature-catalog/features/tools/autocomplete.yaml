id: tools.autocomplete
name: Autocomplete Use Case (Typeahead)
category: tools
summary: |
  사용자 typing 중 prefix completion 제안. Entity Lookup V2 authority 위 thin
  projection + resolver projection hydration. Eval / integration 전용 — production
  Container 및 live HTTP surface에는 등록되지 않음.

maturity: 4
maturity_rationale: |
  Use case + `buildAutocompleteUseCase()` eval factory 완료. Property-based regression
  (autocomplete-properties, fast-check numRuns=100) + dedicated eval script
  (`run-autocomplete-eval.ts`) + unit tests. Production HTTP route 없음 — internal
  typeahead rail only. HONEST 4: NDCG/online calibration 없음.

status: active
since: 2025-10
last_reviewed: 2026-06-10
owner: core

surfaces:
  - "Eval-only: buildAutocompleteUseCase() + run-autocomplete-eval.ts"

key_files:
  - src/application/search/autocomplete.usecase.ts
  - src/config/build-autocomplete-usecase.ts
  - src/application/search/entity-lookup-v2/entity-lookup-v2-autocomplete-mapping.ts

tests:
  unit:
    - test/unit/application/search/autocomplete.usecase.test.ts
    - test/unit/eval/autocomplete-eval.test.ts
  regression:
    - test/regression/autocomplete-properties.regression.test.ts
    - test/regression/lookup-wine-authority-surface.regression.test.ts

depends_on:
  - retrieval.entity-lookup-v2

related_rfcs: []

known_limitations:
