id: tools.resolve
name: Resolve Route (Entity Lookup V2 Authority)
category: tools
summary: |
  Internal `POST /v1/entity/resolve` surface for agent tools and regression. The
  route delegates directly to Entity Lookup V2 via
  `executeResolveViaEntityLookupV2` — no standalone ResolveUseCase.

maturity: 4
maturity_rationale: |
  HONEST 4. route boundary 계약을 fast-check property suite (numRuns=100, 9 tests)
  로 락업: determinism, output-envelope conformance (ResolveResponseSchema .strict()),
  abstention surfacing, Korean NFC/NFD transparency, input schema .strict(), empty/
  adversarial safety. V2 authority mapping tests cover command projection and
  error propagation. 남은 maturity 5 과제: production abstention rate + coverage
  SLA dashboard (ops/monitoring gap, code 결함 아님).

status: active
since: 2025-10
last_reviewed: 2026-06-10
owner: core

surfaces:
  - "POST /v1/entity/resolve (internal)"
  - "Agent tools.resolve"

key_files:
  - src/interface/http/routes/resolve.route.ts
  - src/application/search/entity-lookup-v2/entity-lookup-v2-resolve-mapping.ts
  - src/application/search/entity-lookup-v2/entity-lookup-v2-request-mapping.ts

tests:
  unit:
    - src/application/search/entity-lookup-v2/__tests__/entity-lookup-v2-resolve-mapping.test.ts
  regression:
    - test/regression/resolve-tool-properties.regression.test.ts

depends_on:
  - retrieval.entity-lookup-v2

related_rfcs: []

known_limitations:
  - "Abstention rate 모니터링 없음"
  - "Coverage SLA 없음"

next_steps:
  - "Coverage / abstention dashboard"

tags:
  - entity-resolution
  - abstention
