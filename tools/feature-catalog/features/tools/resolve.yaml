id: tools.resolve
name: Resolve Endpoint (Entity Disambiguation)
category: tools
summary: |
  POST /v1/resolve — 쿼리의 entity 후보를 confidence + abstention 결정과 함께 반환.
  conformal prediction set로 70% coverage guarantee + 명시적 ambiguity hint.

maturity: 4
maturity_rationale: |
  HONEST 4. route boundary 계약을 fast-check property suite (numRuns=100, 9 tests)
  로 락업: determinism (Math.random/Date/iteration-order 누수 없음), output-envelope
  conformance (임의 resolver 결과 → 200 body가 ResolveResponseSchema .strict() 검증,
  snake_case key, candidates ≤ MAX_RESOLVE_CANDIDATES, calibrated_score ∈ [0,1],
  decision_trace_ref === authority_trace_ref), abstention surfacing (ambiguous/
  failed status verbatim 통과, top_entity 절대 fabricate 안 함), Korean NFC/NFD
  transparency (route가 silently re-normalize 안 함 — entity-identity layer 책임,
  no `\b` on Korean), input schema .strict() (HTTP body라 strict 정당 — rule 10),
  empty/adversarial safety (whitespace/control/proto-pollution/length-attack
  no-crash). 기존 19 integration tests 유지. 남은 maturity 5 과제: production
  abstention rate + coverage SLA dashboard (ops/monitoring gap, code 결함 아님).

status: active
since: 2025-10
last_reviewed: 2026-05-22
owner: core

surfaces:
  - "HTTP: POST /v1/resolve"

key_files:
  - src/application/search/resolve.usecase.ts
  - src/interface/http/routes/resolve.route.ts

tests:
