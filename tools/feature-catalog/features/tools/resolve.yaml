id: tools.resolve
name: Resolve Wire Projection (V2 mapping)
category: tools
summary: |
  Legacy ResolveResponse wire shape projected from Entity Lookup V2 via
  `executeResolveViaEntityLookupV2` / `mapEntityLookupV2ResultToResolveResponse`.
  The former `POST /v1/entity/resolve` HTTP route was removed after the V2 cutover.
  Public entity resolve is `POST /v2/entity-lookup`.

maturity: 4
maturity_rationale: |
  HONEST 4. Mapping-only fast-check property suite (numRuns=100) locks determinism,
  ResolveResponseSchema conformance on snake_case wire, abstention surfacing,
  Korean NFC/NFD transparency, LookupWineRequestSchema strict validation, and
  adversarial query safety. Live HTTP harness removed — mapping is the contract rail.

status: deprecated
since: 2025-10
last_reviewed: 2026-06-10
owner: core

surfaces:
  - "Mapping: executeResolveViaEntityLookupV2 → ResolveResponse wire"
  - "Schema: ResolveResponseSchema (historical / agent-compat shape)"

key_files:
  - src/application/search/entity-lookup-v2/entity-lookup-v2-resolve-mapping.ts
  - src/application/search/entity-lookup-v2/entity-lookup-v2-request-mapping.ts
  - src/application/search/resolve-response.dto.ts

tests:
  unit:
    - src/application/search/entity-lookup-v2/__tests__/entity-lookup-v2-resolve-mapping.test.ts
  regression:
    - test/regression/resolve-tool-properties.regression.test.ts

depends_on:
  - retrieval.entity-lookup-v2

related_rfcs: []

known_limitations:
  - "ResolveResponse is not the public HTTP contract — V2 4-state response is canonical"
  - "Abstention rate 모니터링 없음"

next_steps:
  - "Coverage / abstention dashboard (retrieval.entity-lookup-v2 scope)"

tags:
  - entity-resolution
  - abstention
  - mapping-only
