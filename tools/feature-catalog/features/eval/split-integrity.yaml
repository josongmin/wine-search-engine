id: eval.split-integrity
name: Split Integrity Validator
category: eval
summary: |
  train/val/test split의 leakage 검증. 동일 query가 multiple split에 등장 / ground-truth
  label 불일치 등 감지. LTR / offline eval 실행 전 pre-flight gate.

maturity: 5
maturity_rationale: |
  Overlap detection (query hashing + set intersection) + entity-synonym group
  leakage detection. Pre-flight gate로 안정 운영, RFC-017 §2.5 준수.
  SOTA++ 확장:
  - `groupQueriesByEntity` helper: canonical entity_id 기반 split assignment
    (vintage / template variant가 train/val/gate 경계를 넘지 않음).
  - `assignSplitsByEntityGroup`: deterministic seed-based 분배 + MIN split size 보장.
  - `verifyGoldenSplitIntegrity` train↔val entity_id leak 추가 (기존 gate fence 보완).
  - Property-based invariants (fast-check, 100 runs each): query-level uniqueness,
    entity-group leakage, split balance, determinism, relabel consistency.
  - Korean canonical entity_id 보존 테스트 포함.

status: active
since: 2025-10
last_reviewed: 2026-05-21
owner: core

surfaces:
  - "CLI: pre-flight gate before eval/LTR"

key_files:
  - scripts/eval/run-offline-eval.ts
  - scripts/eval/split-integrity.ts

tests:
  regression:
    - test/regression/split-integrity-entity-leakage.regression.test.ts
  unit:
    - test/unit/eval/split-integrity.test.ts

depends_on:
  - eval.offline-eval-runner

related_rfcs:
  - docs/RFC-017.md

known_limitations: []

next_steps:
  - "build-splits.ts에 `assignSplitsByEntityGroup` 통합 (현재 cluster-based assigner와 병행 운영 후 deprecate)"

tags:
  - data-quality
  - leakage-detection
  - property-based-testing
