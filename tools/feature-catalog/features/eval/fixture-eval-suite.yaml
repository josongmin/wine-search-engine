id: eval.fixture-eval-suite
name: Fixture-Based Evaluation Suite
category: eval
summary: |
  Entity retrieval / search feature behavior / agentic tool-use / agentic answer
  quality fixture eval 통합 스위트. 각 feature 영역별 골드 fixture 정의 + 자동
  비교 + smoke-prediction mode.

maturity: 4
maturity_rationale: |
  4종 fixture runner 모두 운영, smoke + live mode 지원. test:verification:search CI
  gate. eval/run-*-fixture-eval.ts 표준화된 patternを. 그러나 fixture format 통일
  안 됨 (runner마다 다름).

status: active
since: 2025-10
last_reviewed: 2026-05-21
owner: core

surfaces:
  - "CLI: pnpm eval:* / test:verification:search"

key_files:
  - scripts/eval/run-entity-retrieval-fixture-eval.ts
  - scripts/eval/run-search-feature-behavior-fixture-eval.ts
  - scripts/eval/run-agentic-tool-use-fixture-eval.ts
  - scripts/eval/run-agentic-answer-quality-fixture-eval.ts

tests:
  e2e:
    - test/e2e/search-replay-fixtures.test.ts

depends_on:
  - infra.anthropic-chat-llm
  - infra.vespa-cloud

related_rfcs: []

known_limitations:
  - "Fixture format이 runner마다 다름"
  - "Auto-discovery 없음"

next_steps:
  - "Fixture schema 통일"
  - "Bench runner와 통합"

tags:
  - fixture-based
  - feature-validation
  - production-eval-coverage
