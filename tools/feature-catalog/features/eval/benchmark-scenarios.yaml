  - test/benchmark/agent/scenarios.coverage.ts
  - test/benchmark/agent/scenarios.adversarial.ts
  - test/benchmark/agent/scenarios.robustness.ts
  - test/benchmark/agent/scenarios.transliteration-large.ts

tests:
