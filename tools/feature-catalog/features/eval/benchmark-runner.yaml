  - test/benchmark/agent/retrieval-ceiling-metrics.ts
  - test/benchmark/agent/scorer.ts
  - test/benchmark/agent/hard-constraints-aggregator.ts
  - test/benchmark/agent/benchmark-insight-generator.ts

