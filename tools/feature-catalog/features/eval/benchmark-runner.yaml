  - infra.anthropic-chat-llm

related_rfcs: []

known_limitations:
  - "LLM-judge variance는 본질적 한계 (확률적 rubric) — N=3 median + DIMENSION_FLOOR로 완화하나 제거 불가"
  - "Rubric 수작업 tuning per scenario"
  - "Rubric drift 자동 감지 없음 (확률적 judge 레이어에 국한; 결정론적 harness는 property-locked)"

