name: CI
on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - name: Cache ESLint
        uses: actions/cache@v4
        with:
          path: .eslintcache
          key: ${{ runner.os }}-eslint-${{ hashFiles('package-lock.json','eslint.config.js') }}
          restore-keys: |
            ${{ runner.os }}-eslint-
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - name: Cache TypeScript incremental
        uses: actions/cache@v4
        with:
          path: |
            .tsbuildinfo
          key: ${{ runner.os }}-tsc-noemit-${{ hashFiles('tsconfig.json','package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-tsc-noemit-
      - run: npm ci
      - run: npm run typecheck

  test-unit:
    runs-on: ubuntu-latest
    env:
      VITEST_MAX_THREADS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run test:unit

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run test:integration

  test-watchlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run test:watchlist

  test-e2e-fast:
    runs-on: ubuntu-latest
    env:
      VITEST_MAX_FORKS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run test:e2e:fast

  verification-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITEST_MAX_FORKS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - name: Cache TypeScript incremental
        uses: actions/cache@v4
        with:
          path: |
            .tsbuildinfo
            .tsbuildinfo.build
          key: ${{ runner.os }}-tsc-verify-${{ hashFiles('tsconfig.json','tsconfig.build.json','package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-tsc-verify-
      - run: npm ci
      - name: Run core verification gate
        run: npm run test:verification:core
      - name: CI summary
        run: |
          {
            echo "## Core Verification"
            echo ""
            echo "- Gate: \`npm run test:verification:core\`"
            echo "- Includes: typecheck, fast e2e, noisy quality gate, noisy baseline regression"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-splits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Verify eval splits
        run: npx tsx scripts/eval/verify-splits.ts

  eval-noisy-entity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Noisy entity eval smoke
        run: npm run eval:noisy:smoke
      - name: Assert noisy entity baseline
        run: npm run eval:noisy:assert-baseline

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-unit, test-integration, test-watchlist, test-e2e-fast, verify-splits, eval-noisy-entity, verification-core]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - name: Cache TypeScript build incremental
        uses: actions/cache@v4
        with:
          path: |
            .tsbuildinfo.build
          key: ${{ runner.os }}-tsc-build-${{ hashFiles('tsconfig.build.json','tsconfig.json','package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-tsc-build-
      - run: npm ci
      - run: npm run build
      - run: docker build -t wine-search-engine .
