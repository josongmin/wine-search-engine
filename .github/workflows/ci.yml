name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-node-ci
      - name: Cache ESLint
        uses: actions/cache@v4
        with:
          path: .eslintcache
          key: ${{ runner.os }}-eslint-${{ hashFiles('package-lock.json','eslint.config.js') }}
          restore-keys: |
            ${{ runner.os }}-eslint-
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-node-ci
      - name: Cache TypeScript incremental (noEmit)
        uses: actions/cache@v4
        with:
          path: .tsbuildinfo
          key: ${{ runner.os }}-tsc-noemit-${{ hashFiles('tsconfig.json','tsconfig.build.json','package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-tsc-noemit-
      - run: npm run typecheck

  test-unit:
    runs-on: ubuntu-latest
    env:
      VITEST_MAX_THREADS: 4
    steps:
      - uses: ./.github/actions/setup-node-ci
      - run: npm run test:unit

  test-integration:
    runs-on: ubuntu-latest
    env:
      VITEST_MAX_THREADS: 4
    steps:
      - uses: ./.github/actions/setup-node-ci
      - run: npm run test:integration

  test-watchlist:
    runs-on: ubuntu-latest
    env:
      VITEST_MAX_THREADS: 4
    steps:
      - uses: ./.github/actions/setup-node-ci
      - run: npm run test:watchlist

  test-e2e-fast:
    runs-on: ubuntu-latest
    env:
      VITEST_MAX_FORKS: 4
    steps:
      - uses: ./.github/actions/setup-node-ci
      - run: npm run test:e2e:fast

  verification-core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [typecheck, test-e2e-fast]
    steps:
      - uses: ./.github/actions/setup-node-ci
      - name: Noisy entity gate + baseline (no duplicate typecheck/e2e)
        run: npm run test:verification:noisy
      - name: CI summary
        run: |
          {
            echo "## Noisy verification (CI)"
            echo ""
            echo "- Gate: \`npm run test:verification:noisy\` (= \`eval:noisy:gate\` + assert on same /tmp artifact; after \`typecheck\` + \`test:e2e:fast\`)"
            echo "- Local full gate: \`npm run test:verification:core\` (= typecheck + e2e + noisy)"
            echo "- Standalone smoke JSON: \`npm run eval:noisy:smoke\`"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-splits:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-node-ci
      - name: Verify eval splits
        run: npx tsx scripts/eval/verify-splits.ts

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-unit, test-integration, test-watchlist, test-e2e-fast, verify-splits, verification-core]
    steps:
      - uses: ./.github/actions/setup-node-ci
      - name: Cache TypeScript build incremental
        uses: actions/cache@v4
        with:
          path: |
            .tsbuildinfo.build
          key: ${{ runner.os }}-tsc-build-${{ hashFiles('tsconfig.build.json','tsconfig.json','package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-tsc-build-
      - run: npm run build
      - run: docker build -t wine-search-engine .
