name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-node-ci
      - name: Cache ESLint
        uses: actions/cache@v4
        with:
          path: .eslintcache
          key: ${{ runner.os }}-eslint-${{ hashFiles('package-lock.json','eslint.config.js') }}
          restore-keys: |
            ${{ runner.os }}-eslint-
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-node-ci
      - name: Cache TypeScript incremental (noEmit)
        uses: actions/cache@v4
        with:
          path: .tsbuildinfo
          key: ${{ runner.os }}-tsc-noemit-${{ hashFiles('tsconfig.json','tsconfig.build.json','package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-tsc-noemit-
      - run: npm run typecheck

  test-unit:
    runs-on: ubuntu-latest
    env:
      VITEST_MAX_THREADS: 4
    steps:
      - uses: ./.github/actions/setup-node-ci
      - run: npm run test:coverage

  test-integration:
    runs-on: ubuntu-latest
    env:
      VITEST_MAX_THREADS: 4
      FIXTURE_REPO_PATH: ${{ github.workspace }}/wine-engine-fixture
    steps:
      - uses: ./.github/actions/setup-node-ci
      - name: Checkout fixture repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/wine-engine-fixture
          path: wine-engine-fixture
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate fixture integrity
        working-directory: ${{ github.workspace }}/wine-engine-fixture
        run: npx tsx scripts/validate-integrity.ts
      - name: Verify target-entity-map is up to date
        working-directory: ${{ github.workspace }}/wine-engine-fixture
        run: npx tsx scripts/generate-target-entity-map.ts --verify
      - name: Engine fixture governance (FixtureLoader + suite contracts)
        run: npm run eval:fixtures:verify
      - run: npm run test:integration

  test-watchlist:
    runs-on: ubuntu-latest
    env:
      VITEST_MAX_THREADS: 4
    steps:
      - uses: ./.github/actions/setup-node-ci
      - run: npm run test:watchlist

  test-e2e-contract:
    runs-on: ubuntu-latest
    env:
      VITEST_MAX_FORKS: 4
    steps:
      - uses: ./.github/actions/setup-node-ci
      - run: npm run test:e2e:contract

  test-e2e-runtime:
    runs-on: ubuntu-latest
    env:
      VITEST_MAX_FORKS: 4
    steps:
      - uses: ./.github/actions/setup-node-ci
      - run: npm run test:e2e:runtime

  test-ingest-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-node-ci
      - run: npm run test:ingest:contract

  security-semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: ./.github/actions/setup-node-ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Semgrep CLI
        run: python -m pip install --upgrade pip semgrep
      - name: Run Semgrep security scan
        run: npm run semgrep

  verification-core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [typecheck, test-e2e-contract, test-e2e-runtime, test-ingest-contract]
    steps:
      - uses: ./.github/actions/setup-node-ci
      - name: Noisy entity gate + baseline (no duplicate typecheck/e2e)
        run: npm run test:verification:noisy
      - name: CI summary
        run: |
          {
            echo "## Noisy verification (CI)"
            echo ""
            echo "- Gate: \`npm run test:verification:noisy\` (= \`eval:noisy:gate\` + assert on same /tmp artifact; after contract/runtime/ingest core lanes)"
            echo "- Local full gate: \`npm run test:verification:core\` (= typecheck + contract + runtime + ingest-contract + noisy)"
            echo "- Standalone smoke JSON: \`npm run eval:noisy:smoke\`"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-http-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-node-ci
      - run: npm run verify:http-contracts

  verify-splits:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-node-ci
      - name: Verify eval splits
        run: npx tsx scripts/eval/verify-splits.ts

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: ./.github/actions/setup-node-ci
      - run: npm run test:quality

  offline-eval-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: ./.github/actions/setup-node-ci
      - run: npm run eval:offline:smoke:assert-baseline

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-unit, test-integration, test-watchlist, test-e2e-contract, test-e2e-runtime, test-ingest-contract, security-semgrep, verification-core, verify-http-contracts, verify-splits, quality, offline-eval-regression]
    steps:
      - uses: ./.github/actions/setup-node-ci
      - name: Cache TypeScript build incremental
        uses: actions/cache@v4
        with:
          path: |
            .tsbuildinfo.build
          key: ${{ runner.os }}-tsc-build-${{ hashFiles('tsconfig.build.json','tsconfig.json','package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-tsc-build-
      - run: npm run build
      - run: docker build -t wine-search-engine .
