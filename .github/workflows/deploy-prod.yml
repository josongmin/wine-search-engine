name: Deploy Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref to deploy (default: main or CI commit SHA)"
        required: false
        type: string
      image_tag:
        description: "Optional image tag override"
        required: false
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  guard:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      deploy_ref: ${{ steps.meta.outputs.deploy_ref }}
      deploy_sha: ${{ steps.meta.outputs.deploy_sha }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            deploy_ref="${{ inputs.git_ref }}"
            if [[ -z "${deploy_ref}" ]]; then
              deploy_ref="main"
            fi
            image_tag="${{ inputs.image_tag }}"
            if [[ -z "${image_tag}" ]]; then
              image_tag="manual-${GITHUB_SHA}"
            fi
            echo "deploy_ref=${deploy_ref}" >> "$GITHUB_OUTPUT"
            echo "deploy_sha=" >> "$GITHUB_OUTPUT"
            echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          deploy_sha="${{ github.event.workflow_run.head_sha }}"
          if [[ -z "${deploy_sha}" ]]; then
            echo "Missing workflow_run.head_sha" >&2
            exit 1
          fi

          echo "deploy_ref=${deploy_sha}" >> "$GITHUB_OUTPUT"
          echo "deploy_sha=${deploy_sha}" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${deploy_sha}" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: guard
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      DEPLOY_ECR_REPOSITORY: ${{ vars.DEPLOY_ECR_REPOSITORY }}
      DEPLOY_EC2_INSTANCE_ID: ${{ vars.DEPLOY_EC2_INSTANCE_ID }}
      DEPLOY_CONTAINER_NAME: ${{ vars.DEPLOY_CONTAINER_NAME }}
      DEPLOY_HOST_PORT: ${{ vars.DEPLOY_HOST_PORT }}
      DEPLOY_APP_PORT: ${{ vars.DEPLOY_APP_PORT }}
      DEPLOY_ENV_FILE: ${{ vars.DEPLOY_ENV_FILE }}
      DEPLOY_HEALTH_PATH: ${{ vars.DEPLOY_HEALTH_PATH }}
    steps:
      - name: Validate deploy configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in \
            AWS_REGION \
            AWS_DEPLOY_ROLE_ARN \
            DEPLOY_ECR_REPOSITORY \
            DEPLOY_EC2_INSTANCE_ID \
            DEPLOY_CONTAINER_NAME \
            DEPLOY_HOST_PORT \
            DEPLOY_APP_PORT \
            DEPLOY_ENV_FILE \
            DEPLOY_HEALTH_PATH
          do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing repo variable: ${key}" >&2
              exit 1
            fi
          done

      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.deploy_ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}

      - name: Resolve AWS account
        id: aws
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          repo_uri="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/${DEPLOY_ECR_REPOSITORY}"
          echo "account_id=${account_id}" >> "$GITHUB_OUTPUT"
          echo "repo_uri=${repo_uri}" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            -t "${{ steps.aws.outputs.repo_uri }}:${{ needs.guard.outputs.image_tag }}" \
            -t "${{ steps.aws.outputs.repo_uri }}:latest" \
            .

      - name: Push image
        shell: bash
        run: |
          set -euo pipefail
          docker push "${{ steps.aws.outputs.repo_uri }}:${{ needs.guard.outputs.image_tag }}"
          docker push "${{ steps.aws.outputs.repo_uri }}:latest"

      - name: Roll out to EC2 over SSM
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/deploy/ssm-rollout-from-ecr.sh \
            --region "${AWS_REGION}" \
            --instance-id "${DEPLOY_EC2_INSTANCE_ID}" \
            --repository-uri "${{ steps.aws.outputs.repo_uri }}" \
            --image-tag "${{ needs.guard.outputs.image_tag }}" \
            --container-name "${DEPLOY_CONTAINER_NAME}" \
            --host-port "${DEPLOY_HOST_PORT}" \
            --app-port "${DEPLOY_APP_PORT}" \
            --env-file "${DEPLOY_ENV_FILE}" \
            --health-path "${DEPLOY_HEALTH_PATH}"

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "## Production deploy"
            echo ""
            echo "- Ref: \`${{ needs.guard.outputs.deploy_ref }}\`"
            echo "- Image: \`${{ steps.aws.outputs.repo_uri }}:${{ needs.guard.outputs.image_tag }}\`"
            echo "- Instance: \`${DEPLOY_EC2_INSTANCE_ID}\`"
            echo "- Health: \`http://127.0.0.1:${DEPLOY_HOST_PORT}${DEPLOY_HEALTH_PATH}\` (via SSM on host)"
          } >> "$GITHUB_STEP_SUMMARY"
