name: Nightly Tests
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verification-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: ./.github/actions/setup-node-ci
      - run: pnpm run test:verification:core
      - name: Nightly summary
        run: |
          {
            echo "## Nightly Verification"
            echo ""
            echo "- Core gate: passed"
          } >> "$GITHUB_STEP_SUMMARY"

  e2e-inmemory:
    runs-on: ubuntu-latest
    needs: [verification-core]
    steps:
      - uses: ./.github/actions/setup-node-ci
      - run: pnpm run test:e2e:inmemory

  ingest-indexing:
    runs-on: ubuntu-latest
    needs: [verification-core]
    timeout-minutes: 25
    steps:
      - uses: ./.github/actions/setup-node-ci
      - run: pnpm run test:ingest:indexing

  vespa-e2e:
    runs-on: ubuntu-latest
    needs: [verification-core]
    timeout-minutes: 35
    steps:
      - uses: ./.github/actions/setup-node-ci
      - run: pnpm run test:verification:vespa
      - name: Vespa verification summary
        if: always()
        run: |
          {
            echo "## Vespa Verification"
            echo ""
            echo "- Gate: \`pnpm run test:verification:vespa\`"
            echo "- Includes: Vespa e2e, network-services lane, Vespa quality lane"
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    runs-on: ubuntu-latest
    needs: [verification-core]
    steps:
      - uses: ./.github/actions/setup-node-ci
      - run: pnpm run test:quality:nightly

  offline-eval-regression:
    runs-on: ubuntu-latest
    needs: [verification-core]
    steps:
      - uses: ./.github/actions/setup-node-ci
      - run: pnpm run eval:offline:smoke:assert-baseline

  watchlist-pg:
    runs-on: ubuntu-latest
    needs: [verification-core]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wine_engine_test
          POSTGRES_USER: wine
          POSTGRES_PASSWORD: wine_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U wine -d wine_engine_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_URL: postgresql://wine:wine_test@localhost:5433/wine_engine_test
    steps:
      - uses: ./.github/actions/setup-node-ci
      - run: pnpm run test:watchlist:pg

  cutover-pg:
    runs-on: ubuntu-latest
    needs: [verification-core]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wine_engine_test
          POSTGRES_USER: wine
          POSTGRES_PASSWORD: wine_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U wine -d wine_engine_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_URL: postgresql://wine:wine_test@localhost:5433/wine_engine_test
    steps:
      - uses: ./.github/actions/setup-node-ci
      - run: pnpm run test:integration:cutover

  vespa-quality:
    runs-on: ubuntu-latest
    needs: [vespa-e2e]
    steps:
      - uses: ./.github/actions/setup-node-ci
      - run: bash scripts/run-vespa-quality.sh

  # P0.2: AURC-derived per-class refusal threshold derivation. The job
  # refits τ from the latest `eval_results` rows so the runtime
  # `ConfidenceRefusalPolicy` always reads a fresh AURC operating point
  # from `refusal_thresholds`.  The `--dry-run` flag keeps the nightly
  # rehearsal idempotent — production fits run from the deployment
  # operator's job once the verified report is reviewed.
  calibrate-refusal-threshold:
    runs-on: ubuntu-latest
    needs: [verification-core]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wine_engine_test
          POSTGRES_USER: wine
          POSTGRES_PASSWORD: wine_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U wine -d wine_engine_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_CONNECTION_STRING: postgresql://wine:wine_test@localhost:5433/wine_engine_test
    steps:
      - uses: ./.github/actions/setup-node-ci
      - name: Apply migrations
        run: pnpm tsx src/infrastructure/db/migrate.ts
      - name: Derive refusal thresholds (dry-run)
        run: |
          pnpm tsx scripts/calibrate/derive-refusal-threshold.ts \
            --target-coverage 0.85 \
            --min-samples-per-class 1 \
            --report-dir data/refusal-threshold-reports \
            --dry-run || true
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refusal-threshold-report
          path: data/refusal-threshold-reports/*.json
          if-no-files-found: ignore
          retention-days: 14
