name: Search Heavy
on:
  workflow_dispatch:
    inputs:
      run_vespa_verification:
        description: 'Run the Vespa-heavy verification lane'
        required: false
        type: boolean
        default: false
  merge_group:
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'config/vitest/e2e.vespa.config.ts'
      - 'config/vitest/e2e.vespa.smoke.config.ts'
      - 'config/vitest/ingest.contract.config.ts'
      - 'config/vitest/quality.config.ts'
      - 'config/vitest/quality.vespa.config.ts'
      - 'src/application/search/**'
      - 'src/domain/mixed/**'
      - 'src/domain/ranking/**'
      - 'src/domain/retrieval/**'
      - 'src/infrastructure/vespa/**'
      - 'scripts/etl/**'
      - 'test/e2e/golden-set.test.ts'
      - 'test/e2e/specialized-modes-quality.test.ts'
      - 'test/e2e/vespa/**'
      - 'scripts/eval/**'
      - 'scripts/run-vespa-*.sh'
      - 'scripts/seed-vespa-test-data.ts'
      - 'scripts/setup-vespa-test.sh'
      - 'scripts/teardown-vespa-test.sh'
      - '.github/workflows/search-heavy.yml'

concurrency:
  group: search-heavy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  search-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-ci
      - name: Typecheck
        run: pnpm run typecheck
      - name: Search quality gate
        run: pnpm run test:quality
      - name: Offline eval smoke baseline
        run: pnpm run eval:offline:smoke:assert-baseline
      - name: Search-heavy summary
        if: always()
        run: |
          {
            echo "## Search-Heavy Verification"
            echo ""
            echo "- Typecheck: \`pnpm run typecheck\`"
            echo "- Quality gate: \`pnpm run test:quality\`"
            echo "- Offline eval smoke: \`pnpm run eval:offline:smoke:assert-baseline\`"
            echo "- Vespa smoke lane: \`pnpm run test:e2e:vespa:smoke\`"
            echo "- Optional Vespa-heavy lane: manual dispatch with \`run_vespa_verification=true\`"
          } >> "$GITHUB_STEP_SUMMARY"

  vespa-smoke:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && inputs.run_vespa_verification) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [search-quality]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-ci
      - name: Vespa smoke lane
        run: pnpm run test:e2e:vespa:smoke
      - name: Vespa smoke summary
        if: always()
        run: |
          {
            echo "## Vespa Smoke"
            echo ""
            echo "- Lane: \`pnpm run test:e2e:vespa:smoke\`"
            echo "- Covers: direct Vespa sparse search, hybrid HTTP path, learned matcher HTTP path"
          } >> "$GITHUB_STEP_SUMMARY"

  vespa-verification:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_vespa_verification }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [search-quality, vespa-smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-ci
      - name: Vespa-heavy verification
        run: pnpm run test:verification:vespa
      - name: Ingest indexing smoke
        run: pnpm run test:ingest:indexing
      - name: Vespa summary
        if: always()
        run: |
          {
            echo "## Vespa-Heavy Verification"
            echo ""
            echo "- Vespa verification: \`pnpm run test:verification:vespa\`"
            echo "- Ingest indexing smoke: \`pnpm run test:ingest:indexing\`"
            echo "- Includes: Vespa e2e, network-services lane, Vespa quality lane"
          } >> "$GITHUB_STEP_SUMMARY"
