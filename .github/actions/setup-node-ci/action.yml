name: Setup Node (CI)
description: Checkout, Node 22 + npm cache, npm ci — shared by PR CI and nightly workflows.

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
    - name: npm ci
      run: npm ci
      shell: bash
