name: Setup Node (CI)
description: Node 22 + pnpm store cache + frozen install. Caller MUST run actions/checkout@v4 before this action (local composite path resolution).

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 9
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'
    - name: pnpm install
      run: pnpm install --frozen-lockfile
      shell: bash
