# Local dev stack: Postgres only.
# Vespa runs on Vespa Cloud (p0-lab.wine-searcher) — set VESPA_URL in .env.local.
# Redis is optional — app boots without it (in-memory cache fallback).
name: wine-search-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wine_engine
      POSTGRES_USER: wine
      POSTGRES_PASSWORD: wine_dev
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wine -d wine_engine"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
