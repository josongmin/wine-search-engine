# Local full stack: API + Postgres + Redis + Vespa + reranker.
# Project name isolates this from docker-compose.test.yml (`wine-search-test`).
name: wine-search-dev

services:
  app:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      vespa: { condition: service_healthy }
      reranker: { condition: service_healthy }
    environment:
      NODE_ENV: development
      # Override host-relative defaults from .env so the container reaches sibling services.
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: wine_engine
      PG_USER: wine
      PG_PASSWORD: wine_dev
      REDIS_URL: redis://redis:6379
      VESPA_URL: http://vespa:8080
      RERANKER_SERVICE_URL: http://reranker:8081
      # No embedding container in this compose; point at a service on the host if you run one.
      EMBEDDING_SERVICE_URL: http://host.docker.internal:8081
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wine_engine
      POSTGRES_USER: wine
      POSTGRES_PASSWORD: wine_dev
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wine -d wine_engine"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  vespa:
    image: vespaengine/vespa:8
    ports:
      - "8080:8080"  # query/feed API (VESPA_URL from host: http://localhost:8080)
      # Host 19072 avoids clashing with docker-compose.test.yml (Vespa config on 19071 there).
      - "19072:19071"  # config server (host: http://localhost:19072)
    volumes:
      - vespa_data:/opt/vespa/var
      - ./vespa/app:/vespa-app
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:19071/state/v1/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  reranker:
    build: ./services/reranker
    ports: ["8081:8081"]
    environment:
      - MODEL_NAME=BAAI/bge-reranker-v2-m3
      - DEVICE=cpu
    healthcheck:
      # python:3.12-slim has no curl; model download can exceed 120s on first boot.
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8081/health\")" || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 300s

volumes:
  pg_data:
  redis_data:
  vespa_data:
