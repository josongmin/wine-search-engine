version: '3.9'
services:
  app:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      vespa: { condition: service_healthy }
    environment:
      - NODE_ENV=development

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wine_engine
      POSTGRES_USER: wine
      POSTGRES_PASSWORD: wine_dev
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wine -d wine_engine"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  vespa:
    image: vespaengine/vespa:8
    ports:
      - "8080:8080"  # query/feed API
      - "19071:19071"  # config server
    volumes:
      - vespa_data:/opt/vespa/var
      - ./vespa/app:/vespa-app
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:19071/state/v1/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  pg_data:
  redis_data:
  vespa_data:
